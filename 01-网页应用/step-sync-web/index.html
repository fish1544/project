<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>步数同步工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', 'PingFang SC', monospace;
        }
        body {
            background: #e8e4d8;
            background-image: 
                linear-gradient(#d8d4c8 1px, transparent 1px),
                linear-gradient(90deg, #d8d4c8 1px, transparent 1px);
            background-size: 8px 8px;
            min-height: 100vh;
            padding: 16px 14px;
        }

        .card {
            max-width: 420px;
            margin: 0 auto;
            background: #f8f6f0;
            border: 2px solid #2d2a26;
            box-shadow: 6px 6px 0 #2d2a26;
            padding: 20px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #2d2a26;
        }
        .pixel-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 8px;
            border: 2px solid #2d2a26;
            box-shadow: 3px 3px 0 #2d2a26;
            overflow: hidden;
        }
        .pixel-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 20px;
            color: #2d2a26;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .sub {
            font-size: 12px;
            color: #6b6660;
        }

        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #2d2a26;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            background: #fff;
            border: 2px solid #2d2a26;
            border-radius: 0;
            font-size: 15px;
            color: #2d2a26;
            outline: none;
            box-shadow: 3px 3px 0 #c9c4b8;
        }
        input:focus {
            background: #ffffe0;
            box-shadow: 3px 3px 0 #58a950;
        }

        .check-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 14px 0 16px;
            font-size: 14px;
            color: #2d2a26;
        }
        .pixel-check {
            width: 20px;
            height: 20px;
            border: 2px solid #2d2a26;
            background: #fff;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            cursor: pointer;
        }
        .pixel-check.checked {
            background: #58a950;
        }
        .pixel-check.checked::after {
            content: '✓';
            color: #fff;
            font-weight: bold;
            font-size: 13px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #58a950;
            border: 2px solid #2d2a26;
            border-radius: 0;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 3px 3px 0 #2d2a26;
            transition: all 0.1s;
        }
        .btn:active {
            transform: translate(3px,3px);
            box-shadow: 0 0 0 #2d2a26;
        }
        .btn:disabled {
            background: #a0a0a0;
        }

        .result {
            margin-top: 12px;
            padding: 12px;
            border: 2px solid #2d2a26;
            font-size: 13px;
            line-height: 1.5;
            display: none;
        }
        .result.success {
            background: #d0f0c0;
            color: #2d5016;
            display: block;
        }
        .result.error {
            background: #f0c0c0;
            color: #701616;
            display: block;
        }

        .tips {
            margin-top: 12px;
            padding: 10px 12px;
            background: #fff;
            border: 2px solid #2d2a26;
            font-size: 12px;
            color: #5a5650;
            line-height: 1.6;
        }
        .tips h3 {
            color: #2d2a26;
            margin-bottom: 6px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="pixel-icon">
                <img src="assets/walking-icon.png" alt="步行">
            </div>
            <h1>步数同步工具</h1>
            <p class="sub">支持微信 / 支付宝运动</p>
        </div>

        <div class="form-group">
            <label>Zepp 账号</label>
            <input type="text" id="account" placeholder="邮箱 / 手机号">
        </div>

        <div class="form-group">
            <label>Zepp 密码</label>
            <input type="password" id="password" placeholder="账号密码">
        </div>

        <div class="form-group">
            <label>目标步数（选填）</label>
            <input type="number" id="steps" placeholder="留空自动生成安全步数">
        </div>

        <div class="check-row">
            <div class="pixel-check checked" id="checkBox"></div>
            <span>自动生成安全步数，降低风险</span>
        </div>

        <button class="btn" id="submitBtn">立即同步</button>

        <div class="result" id="result"></div>

        <div class="tips">
            <h3>使用说明</h3>
            1. 应用商店下载「Zepp」，邮箱注册账号，无需绑定真实手环<br>
            2. 我的 → 第三方账号绑定，绑定微信/支付宝，等提示绑定成功<br>
            3. 输入账号密码后点同步，3-10分钟自动更新<br>
            4. 每天仅提交一次，不要重复点击。本工具仅作技术分享。
        </div>
    </div>

    <script>
        let randomMode = true;
        const checkBox = document.getElementById('checkBox');
        checkBox.addEventListener('click', () => {
            randomMode = !randomMode;
            checkBox.classList.toggle('checked', randomMode);
        });

        document.getElementById('submitBtn').addEventListener('click', async function() {
            const account = document.getElementById('account').value.trim();
            const password = document.getElementById('password').value.trim();
            let steps = parseInt(document.getElementById('steps').value.trim());
            const resultEl = document.getElementById('result');
            const btn = this;

            if (!account || !password) {
                showResult('请填写账号和密码', 'error');
                return;
            }
            if (randomMode || !steps) steps = Math.floor(Math.random()*9000)+7000;
            if (steps>30000) steps=30000;
            if (steps<100) steps=100;

            btn.disabled = true;
            btn.textContent = '同步中';

            try {
                const formData = new FormData();
                formData.append('user', account);
                formData.append('password', password);
                formData.append('step', steps);
                const res = await fetch('https://www.xzzsb.xyz/sport/sd/proxy.php', {method:'POST', body:formData});
                const data = await res.json();

                if (data.code === 200) {
                    showResult(`提交成功！本次步数 ${steps}，3-10分钟后查看，请勿重复提交。`, 'success');
                } else {
                    showResult(`提交失败：${data.msg}`, 'error');
                }
            } catch (err) {
                showResult('网络错误，请刷新重试。', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '立即同步';
            }
        });

        function showResult(text, type) {
            const resultEl = document.getElementById('result');
            resultEl.textContent = text;
            resultEl.className = `result ${type}`;
        }
    </script>
</body>
</html>
