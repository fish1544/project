<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>步数同步工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        }
        body {
            background: linear-gradient(180deg, #f7f9fc 0%, #eef2f7 100%);
            min-height: 100vh;
            padding: 32px 20px;
        }

        .card {
            max-width: 420px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(100, 120, 150, 0.1);
            padding: 36px 28px;
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 14px;
            background: linear-gradient(135deg, #e0f2fe, #dcfce7);
            border-radius: 20px;
            display: grid;
            place-items: center;
            font-size: 30px;
        }
        h1 {
            font-size: 22px;
            color: #1e293b;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .sub {
            font-size: 13px;
            color: #94a3b8;
        }

        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #475569;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            color: #1e293b;
            outline: none;
            transition: all 0.2s;
        }
        input:focus {
            background: #fff;
            border-color: #7dd3fc;
            box-shadow: 0 0 0 4px rgba(125, 211, 252, 0.15);
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 22px 0 28px;
            font-size: 14px;
            color: #64748b;
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #0ea5e9;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.25);
            transition: all 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            background: #94a3b8;
            box-shadow: none;
        }

        .result {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            display: none;
        }
        .result.success {
            background: #f0fdf4;
            color: #166534;
            display: block;
        }
        .result.error {
            background: #fef2f2;
            color: #991b1b;
            display: block;
        }

        .tips {
            margin-top: 28px;
            padding: 18px;
            background: #f8fafc;
            border-radius: 14px;
            font-size: 12.5px;
            color: #64748b;
            line-height: 1.8;
        }
        .tips h3 {
            color: #334155;
            margin-bottom: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="icon">🚶</div>
            <h1>步数同步工具</h1>
            <p class="sub">支持微信 / 支付宝运动</p>
        </div>

        <div class="form-group">
            <label>Zepp 账号</label>
            <input type="text" id="account" placeholder="邮箱 / 手机号">
        </div>

        <div class="form-group">
            <label>Zepp 密码</label>
            <input type="password" id="password" placeholder="账号密码">
        </div>

        <div class="form-group">
            <label>目标步数（选填）</label>
            <input type="number" id="steps" placeholder="留空自动生成安全步数">
        </div>

        <div class="row">
            <input type="checkbox" id="randomMode" checked>
            <label for="randomMode" style="margin:0; font-weight: normal;">自动生成安全步数，降低风险</label>
        </div>

        <button class="btn" id="submitBtn">立即同步</button>

        <div class="result" id="result"></div>

        <div class="tips">
            <h3>使用说明</h3>
            1. 应用商店下载「Zepp」，邮箱注册，无需绑定真实手环<br>
            2. 我的 → 第三方账号绑定，绑定微信/支付宝，等提示绑定成功<br>
            3. 输入账号密码点同步，3-10分钟自动更新<br>
            4. 每天仅提交一次，不要重复点击。本工具仅作技术分享。
        </div>
    </div>

    <script>
        document.getElementById('submitBtn').addEventListener('click', async function() {
            const account = document.getElementById('account').value.trim();
            const password = document.getElementById('password').value.trim();
            let steps = parseInt(document.getElementById('steps').value.trim());
            const randomMode = document.getElementById('randomMode').checked;
            const btn = this;

            if (!account || !password) {
                showResult('请填写账号和密码', 'error');
                return;
            }
            if (randomMode || !steps) steps = Math.floor(Math.random()*9000)+7000;
            if (steps>30000) steps=30000;
            if (steps<100) steps=100;

            btn.disabled = true;
            btn.textContent = '同步中...';

            try {
                const formData = new FormData();
                formData.append('user', account);
                formData.append('password', password);
                formData.append('step', steps);
                const res = await fetch('https://www.xzzsb.xyz/sport/sd/proxy.php', {method:'POST', body:formData});
                const data = await res.json();

                if (data.code === 200) {
                    showResult(`提交成功！本次步数 ${steps}，3-10分钟后查看，请勿重复提交。`, 'success');
                } else {
                    showResult(`提交失败：${data.msg}`, 'error');
                }
            } catch (err) {
                showResult('网络错误，请刷新重试。', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '立即同步';
            }
        });

        function showResult(text, type) {
            const resultEl = document.getElementById('result');
            resultEl.textContent = text;
            resultEl.className = `result ${type}`;
        }
    </script>
</body>
</html>
