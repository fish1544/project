var grid = document.getElementById('grid');
var search = document.getElementById('search');
var empty = document.getElementById('empty');
var tabsEl = document.getElementById('tabs');
var countEl = document.getElementById('count');
var cats = ['全部'];
tools.forEach(function(t){ if(cats.indexOf(t.c)<0) cats.push(t.c); });
var activeCat = '全部';

tabsEl.innerHTML = cats.map(function(c){ return '<div class="tab'+(c===activeCat?' active':'')+'" data-c="'+c+'">'+c+'</div>'; }).join('');

function render() {
  var q = search.value.trim().toLowerCase();
  var list = tools.filter(function(t){
    var okCat = (activeCat==='全部' || t.c===activeCat);
    var okQ = (!q || t.n.toLowerCase().indexOf(q)>=0 || t.d.toLowerCase().indexOf(q)>=0);
    return okCat && okQ;
  });
  grid.innerHTML = list.map(function(t){
    var letter = t.n.charAt(0);
    return '<a class="card" href="'+t.l+'" target="_blank" rel="noopener">'+
      '<div class="card-head"><div class="icon">'+
      '<img src="'+t.i+'" alt="'+t.n+'" loading="lazy" onerror="this.style.display=\'none\';this.parentNode.textContent=\''+letter+'\'">'+
      '</div><div class="name">'+t.n+'</div></div>'+
      '<p class="desc">'+t.d+'</p></a>';
  }).join('');
  empty.style.display = list.length ? 'none' : 'block';
  countEl.textContent = '共 ' + tools.length + ' 款工具 · ' + (activeCat==='全部'?'全部分类':activeCat) + ' · 显示 ' + list.length + ' 款';
}
search.addEventListener('input', render);
tabsEl.addEventListener('click', function(e){
  var t = e.target.closest('.tab'); if(!t) return;
  activeCat = t.dataset.c;
  document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('active', x===t); });
  render();
});
render();
</script>
