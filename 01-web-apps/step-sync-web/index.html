<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>步数同步工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', 'PingFang SC', monospace;
        }
        ::placeholder { color: #a9a49a; }
        body {
            background: #e8e4d8;
            background-image: 
                linear-gradient(#d8d4c8 1px, transparent 1px),
                linear-gradient(90deg, #d8d4c8 1px, transparent 1px);
            background-size: 8px 8px;
            min-height: 100vh;
            padding: 16px 14px;
        }

        .card {
            max-width: 420px;
            margin: 0 auto;
            background: #f8f6f0;
            border: 2px solid #2d2a26;
            box-shadow: 6px 6px 0 #2d2a26;
            padding: 20px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #2d2a26;
        }
        .pixel-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 8px;
            border: 2px solid #2d2a26;
            box-shadow: 3px 3px 0 #2d2a26;
            overflow: hidden;
            transition: transform 0.15s;
        }
        .pixel-icon:active { transform: scale(0.95); }
        .pixel-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 20px;
            color: #2d2a26;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .sub {
            font-size: 12px;
            color: #6b6660;
        }

        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #2d2a26;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            background: #fff;
            border: 2px solid #2d2a26;
            border-radius: 0;
            font-size: 15px;
            color: #2d2a26;
            outline: none;
            box-shadow: 3px 3px 0 #c9c4b8;
            transition: all 0.15s;
        }
        input:focus {
            background: #f8ffe8;
            box-shadow: 3px 3px 0 #58a950;
            transform: translate(-1px,-1px);
        }

        .check-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 12px 0 14px;
            font-size: 14px;
            color: #2d2a26;
            cursor: pointer;
        }
        .pixel-check {
            width: 20px;
            height: 20px;
            border: 2px solid #2d2a26;
            background: #fff;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.1s;
        }
        .pixel-check:active { transform: scale(0.9); }
        .pixel-check.checked {
            background: #58a950;
        }
        .pixel-check.checked::after {
            content: '✓';
            color: #fff;
            font-weight: bold;
            font-size: 13px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #58a950;
            border: 2px solid #2d2a26;
            border-radius: 0;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 3px 3px 0 #2d2a26;
            transition: all 0.1s;
        }
        .btn:active {
            transform: translate(3px,3px);
            box-shadow: 0 0 0 #2d2a26;
        }
        .btn:disabled {
            background: #88b880;
            cursor: wait;
        }

        .result {
            margin-top: 12px;
            padding: 10px 12px;
            border: 2px solid #2d2a26;
            font-size: 13px;
            line-height: 1.5;
            display: none;
            border-left-width: 6px;
        }
        .result.success {
            background: #e2f4d8;
            color: #2d5016;
            display: block;
            border-left-color: #58a950;
        }
        .result.error {
            background: #f8dcdc;
            color: #701616;
            display: block;
            border-left-color: #d06060;
        }

        .local-tip {
            margin-top: 8px;
            padding: 8px 10px;
            background: #fff8e0;
            border: 2px solid #2d2a26;
            font-size: 12px;
            line-height: 1.5;
        }
        .local-tip a {
            color: #2d5016;
            font-weight: bold;
        }
        .tips {
            margin-top: 12px;
            padding: 10px 12px;
            background: #fff;
            border: 2px solid #2d2a26;
            font-size: 12px;
            color: #5a5650;
            line-height: 1.6;
        }
        .tips h3 {
            color: #2d2a26;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .tip-item { margin-bottom: 2px; }
        .tip-item:last-child { margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="pixel-icon">
                <img src="assets/walking-icon.png" alt="步行">
            </div>
            <h1>步数同步工具</h1>
            <p class="sub">支持微信 / 支付宝运动</p>
        </div>

        <div class="form-group">
            <label>Zepp 账号</label>
            <input type="text" id="account" placeholder="邮箱 / 手机号">
        </div>

        <div class="form-group">
            <label>Zepp 密码</label>
            <input type="password" id="password" placeholder="账号密码">
        </div>

        <div class="form-group">
            <label>目标步数（选填）</label>
            <input type="number" id="steps" placeholder="留空自动生成安全步数">
        </div>

        <div class="check-row">
            <div class="pixel-check checked" id="checkBox"></div>
            <span>自动生成安全步数，降低风险</span>
        </div>

        <button class="btn" id="submitBtn">立即同步</button>

        <div class="result" id="result"></div>

        <div class="local-tip">
          网页提交不稳定？<a href="step-tool.zip">点击下载本地工具</a>，解压后双击运行，成功率100%
        </div>

        <div class="tips">
            <h3>使用说明</h3>
            <div class="tip-item">• 应用商店下载「Zepp Life」，邮箱+密码注册，无需绑定手环手表等设备</div>
            <div class="tip-item">• 我的页面—第三方接入->绑定微信/支付宝，提示已绑定即可</div>
            <div class="tip-item">• 提交成功后等待10分钟以内，步数自动更新</div>
            <div class="tip-item">• 安全步数范围：建议7000-16000步，最高不超过30000步，不要填极端数值</div>
            <div class="tip-item">• 微信内打开提交失败时，请点右上角选择「在浏览器打开」再提交</div>
            <div class="tip-item">• 每天仅提交一次，请勿重复点击，否则有Zepp官方风控风险（不会封微信）</div>
        </div>
    </div>

    <script>
        let randomMode = true;
        const checkBox = document.getElementById('checkBox');
        checkBox.addEventListener('click', () => {
            randomMode = !randomMode;
            checkBox.classList.toggle('checked', randomMode);
        });

        document.getElementById('submitBtn').addEventListener('click', async function() {
            const account = document.getElementById('account').value.trim();
            const password = document.getElementById('password').value.trim();
            let steps = parseInt(document.getElementById('steps').value.trim());
            const resultEl = document.getElementById('result');
            const btn = this;

            if (!account || !password) {
                showResult('请填写账号和密码', 'error');
                return;
            }
            if (randomMode || !steps) steps = Math.floor(Math.random()*9000)+7000;
            if (steps>30000) steps=30000;
            if (steps<100) steps=100;

            btn.disabled = true;
            btn.textContent = '同步中...';

            // 自动重试逻辑：最多试2次
            for (let attempt = 0; attempt < 2; attempt++) {
                try {
                    const formData = new FormData();
                    formData.append('user', account);
                    formData.append('password', password);
                    formData.append('step', steps);
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 10000);
                    const res = await fetch('https://step-sync-web.fish1544.workers.dev/', {
                        method:'POST',
                        body:formData,
                        signal: controller.signal
                    });
                    clearTimeout(timeout);
                    const data = await res.json();

                    if (data.code === 200) {
                        showResult(`提交成功！本次步数 ${steps}，3-10分钟后查看，请勿重复提交。`, 'success');
                        btn.disabled = false;
                        btn.textContent = '立即同步';
                        return;
                    } else {
                        showResult(`提交失败：${data.msg}`, 'error');
                        btn.disabled = false;
                        btn.textContent = '立即同步';
                        return;
                    }
                } catch (err) {
                    if (attempt === 0) {
                        showResult('网络波动，正在自动重试...', 'error');
                        await new Promise(r => setTimeout(r, 2000));
                    } else {
                        showResult('服务暂时繁忙，请30秒后再试。', 'error');
                    }
                }
            }
            btn.disabled = false;
            btn.textContent = '立即同步';
        });

        function showResult(text, type) {
            const resultEl = document.getElementById('result');
            resultEl.textContent = text;
            resultEl.className = `result ${type}`;
        }
    </script>
</body>
</html>
