<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌面 AI 助手导航</title>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: 'Courier New', 'PingFang SC', monospace;
  }
  ::placeholder { color: #a9a49a; }
  body {
    background: #e8e4d8;
    background-image:
      linear-gradient(#d8d4c8 1px, transparent 1px),
      linear-gradient(90deg, #d8d4c8 1px, transparent 1px);
    background-size: 8px 8px;
    min-height: 100vh;
    padding: 28px 16px 60px;
    color: #2d2a26;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  /* 头部 */
  .header {
    background: #f8f6f0; border: 2px solid #2d2a26;
    box-shadow: 6px 6px 0 #2d2a26;
    padding: 26px 22px; text-align: center; margin-bottom: 22px;
  }
  .badge {
    display: inline-block; font-size: 12px; letter-spacing: 1px;
    background: #58a950; color: #fff; padding: 4px 12px;
    border: 2px solid #2d2a26; margin-bottom: 14px;
    box-shadow: 3px 3px 0 #2d2a26;
  }
  h1 { font-size: 26px; font-weight: bold; letter-spacing: 1px; margin-bottom: 8px; }
  .sub { font-size: 13px; color: #6b6660; line-height: 1.6; }
  .count { font-size: 12px; color: #6b6660; margin-top: 10px; }

  /* 搜索 */
  .search-box {
    position: relative; margin: 16px auto 0; max-width: 520px;
  }
  .search-box input {
    width: 100%; padding: 11px 14px 11px 40px;
    background: #fff; border: 2px solid #2d2a26; border-radius: 0;
    font-size: 14px; color: #2d2a26; outline: none;
    box-shadow: 3px 3px 0 #c9c4b8;
  }
  .search-box input:focus {
    background: #f8ffe8; box-shadow: 3px 3px 0 #58a950;
  }
  .search-box svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  }

  /* 标签 */
  .tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .tag {
    font-size: 12px; padding: 6px 12px; cursor: pointer;
    background: #fff; border: 2px solid #2d2a26; color: #2d2a26;
    box-shadow: 2px 2px 0 #c9c4b8; transition: all .1s; user-select: none;
  }
  .tag:active { transform: translate(2px,2px); box-shadow: 0 0 0 #c9c4b8; }
  .tag.active { background: #58a950; color: #fff; box-shadow: 2px 2px 0 #2d2a26; }

  /* 网格 */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px; margin-top: 22px;
  }
  .card {
    display: flex; flex-direction: column; gap: 12px;
    background: #f8f6f0; border: 2px solid #2d2a26;
    box-shadow: 5px 5px 0 #2d2a26;
    padding: 16px; text-decoration: none; color: #2d2a26;
    transition: transform .1s, box-shadow .1s;
  }
  .card:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 #2d2a26; background: #fff; }
  .card:active { transform: translate(3px,3px); box-shadow: 0 0 0 #2d2a26; }
  .card-head { display: flex; align-items: center; gap: 12px; }
  .icon {
    width: 52px; height: 52px; flex-shrink: 0;
    background: #fff; border: 2px solid #2d2a26;
    box-shadow: 3px 3px 0 #c9c4b8; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .icon img { width: 100%; height: 100%; object-fit: contain; }
  .name { font-size: 15px; font-weight: bold; line-height: 1.3; }
  .cat {
    display: inline-block; font-size: 10px; margin-top: 3px;
    background: #e8e4d8; border: 1px solid #2d2a26; padding: 1px 6px;
  }
  .desc { font-size: 12.5px; line-height: 1.6; color: #5a5650; flex-grow: 1; }
  .go {
    font-size: 11px; color: #58a950; font-weight: bold;
    border-top: 1px dashed #2d2a26; padding-top: 8px;
  }

  .empty {
    text-align: center; color: #6b6660; padding: 50px 0;
    font-size: 14px; display: none;
  }
  footer {
    text-align: center; margin-top: 36px; font-size: 11px; color: #6b6660;
  }
  footer a { color: #2d2a26; }

  @media (max-width: 600px) {
    h1 { font-size: 20px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>桌面 AI 助手导航</h1>
    <p class="sub">主流桌面端 AI Agent 与智能办公助手合集</p>
    <div class="count" id="count"></div>
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2d2a26" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="search" placeholder="搜索工具名称或描述…" autocomplete="off">
    </div>
    <div class="tags" id="tags"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">没有找到匹配的工具，换个关键词试试。</div>

  <footer>
    桌面 AI 助手导航 · 共 26 款工具 · 点击卡片前往官网
  </footer>
</div>

<script>
const tools = [
  { n:"豆包工作", c:"字节跳动", d:"豆包工作任务改版，面向办公场景的 AI 任务执行助手。", i:"assets/doubao-work.jpg", t:"大厂", l:"https://www.doubao.com/" },
  { n:"WorkBuddy", c:"腾讯", d:"腾讯出品的全场景 AI 办公工作台，说出要求即开始执行。", i:"assets/workbuddy.jpg", t:"大厂", l:"https://www.workbuddy.cn/" },
  { n:"Loomy AI工作搭子", c:"科大讯飞", d:"讯飞桌面级 AI 办公助理，低门槛、高安全、强适配、主动协作。", i:"assets/loomy.jpg", t:"办公", l:"https://loomy.xunfei.cn/" },
  { n:"ArkClaw", c:"火山引擎", d:"火山引擎推出的 7×24 在线专属智能伙伴。", i:"assets/arkclaw.jpg", t:"大厂", l:"https://www.volcengine.com/" },
  { n:"DuMate", c:"OpenClaw 框架", d:"国产企业级满血版 OpenClaw（龙虾）AI 智能体框架。", i:"assets/dumate.jpg", t:"开源", l:"https://openclaw.ai/" },
  { n:"千问办公", c:"阿里巴巴", d:"专业级 AI 协同办公平台，理解、拆解并执行复杂任务的 AI Agent 系统。", i:"assets/qianwen.jpg", t:"大厂", l:"https://www.tongyi.com/" },
  { n:"灵犀", c:"金山办公", d:"WPS 推出的个人办公智能体，自主规划步骤、调用工具，直接产出 Word/Excel/PPT 成品。", i:"assets/lingxi.jpg", t:"办公", l:"https://lingxi.cn/" },
  { n:"MiniMax Hub", c:"MiniMax", d:"你的 AI 创作工作室，自动调度图像、视频、配音、剪辑等多种模型。", i:"assets/minimax-hub.jpg", t:"创作", l:"https://www.minimaxi.com/" },
  { n:"妙手 CatPaw", c:"美团", d:"美团全场景 AI Agent 平台，一句话见成果，搭载 LongCat 2.0。", i:"assets/catpaw.jpg", t:"大厂", l:"https://catpaw.meituan.com/" },
  { n:"纳米 Work", c:"360", d:"360 推出的企业智能体工作平台，把 AI 从回答问题变为交付成果的数字员工团队。", i:"assets/nami-work.jpg", t:"办公", l:"https://work.n.cn/" },
  { n:"QoderWork", c:"阿里巴巴", d:"将 Qoder 的 Agent 能力从代码领域扩展到日常工作场景，描述需求、自动执行、直接交付。", i:"assets/qoder-work.jpg", t:"办公", l:"https://qoder.com.cn/qoderwork" },
  { n:"Marvis", c:"腾讯", d:"腾讯应用宝团队研发的操作系统级 AI 管家，24 小时在线，本地大模型文件零上传。", i:"assets/marvis.jpg", t:"陪伴", l:"https://marvis.qq.com/" },
  { n:"讯飞星辰 AstronClaw", c:"科大讯飞", d:"讯飞星辰 Agent 平台 AstronClaw。", i:"assets/astronclaw.jpg", t:"大厂", l:"https://xingchen.xfyun.cn/" },
  { n:"LobsterAI 有道龙虾", c:"网易有道", d:"网易有道推出的国内首款 MIT 开源本土化 OpenClaw 智能体产品。", i:"assets/lobster-ai.jpg", t:"开源", l:"https://www.youdao.com/" },
  { n:"Kimi Work", c:"月之暗面", d:"Kimi 官方桌面客户端，面向知识工作者的本地智能体，支持浏览器自动化与全天候任务。", i:"assets/kimi-work.jpg", t:"大厂", l:"https://www.kimi.com/products/kimi-work" },
  { n:"KroWork", c:"无代码", d:"从聊天到软件，自然语言对话即可将重复工作流程转化为桌面应用。", i:"assets/kro-work.jpg", t:"无代码", l:"https://www.kro.work/" },
  { n:"星辰超级智能体", c:"科大讯飞", d:"定位为 AI 办公搭子，本地化部署和深度系统集成，自动化处理办公任务。", i:"assets/star-super.jpg", t:"办公", l:"https://xingchen.xfyun.cn/" },
  { n:"AutoClaw", c:"智谱 AI", d:"国内首个真一键安装本地版 OpenClaw，主打本地执行、飞书集成、全模型兼容。", i:"assets/autoclaw.jpg", t:"开源", l:"https://www.zhipuai.cn/" },
  { n:"Agnes AI", c:"多智能体", d:"多智能体协同架构，涵盖研究、设计、演示与编程的一体化工作流。", i:"assets/agnes-ai.jpg", t:"办公", l:"https://agnes-ai.com/" },
  { n:"QClaw", c:"腾讯", d:"腾讯电脑管家本地版 OpenClaw，将 AI 执行能力与微信/QQ 社交入口深度融合。", i:"assets/qclaw.jpg", t:"大厂", l:"https://qclaw.qq.com/" },
  { n:"阿里悟空", c:"阿里巴巴", d:"钉钉原生打造的企业级 AI Agent 平台，让 AI 从会回答进化到能交付。", i:"assets/ali-wukong.jpg", t:"大厂", l:"https://wukong.dingtalk.com/" },
  { n:"JVS Claw", c:"阿里云", d:"阿里云无影推出的云原生 OpenClaw 智能体平台，零门槛接入、云上安全养虾。", i:"assets/jvs-claw.jpg", t:"大厂", l:"https://jvsclaw.aliyun.com/" },
  { n:"元气 AI Bot", c:"国产 Clawd", d:"国产 Clawdbot，一键安装免费使用，一句话指令自动操作电脑。", i:"assets/yuanqi.jpg", t:"陪伴", l:"https://yuanqiai.net/" },
  { n:"阶跃 AI 桌面伙伴", c:"阶跃星辰", d:"全场景自动化、本地化安全、免费开放，接入 5000+ 技能的终端 Agent。", i:"assets/stepfun.jpg", t:"办公", l:"https://www.stepfun.com/download" },
  { n:"墨见", c:"墨刀", d:"墨刀推出的一人公司 AI 智能体，集结产品、架构、设计虚拟团队，从原型到代码落地。", i:"assets/mojian.jpg", t:"办公", l:"https://mojian.cn/" },
  { n:"ToDesk AI", c:"ToDesk", d:"集成在 ToDesk 中的云端 AI 助手，自然语言指挥所有设备自动完成办公任务。", i:"assets/todesk.jpg", t:"办公", l:"https://www.todesk.com/" },
];

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const empty = document.getElementById('empty');
const tagsEl = document.getElementById('tags');
const countEl = document.getElementById('count');
let activeTag = '全部';

const cats = ['全部', ...new Set(tools.map(t => t.t))];
tagsEl.innerHTML = cats.map(c => `<div class="tag ${c===activeTag?'active':''}" data-c="${c}">${c}</div>`).join('');

function render() {
  const q = search.value.trim().toLowerCase();
  const list = tools.filter(t => {
    const okTag = activeTag === '全部' || t.t === activeTag;
    const okQ = !q || t.n.toLowerCase().includes(q) || t.d.toLowerCase().includes(q) || t.c.toLowerCase().includes(q);
    return okTag && okQ;
  });
  grid.innerHTML = list.map(t => `
    <a class="card" href="${t.l}" target="_blank" rel="noopener">
      <div class="card-head">
        <div class="icon"><img src="${t.i}" alt="${t.n}" loading="lazy"></div>
        <div>
          <div class="name">${t.n}</div>
          <span class="cat">${t.c}</span>
        </div>
      </div>
      <p class="desc">${t.d}</p>
      <div class="go">→ 前往官网</div>
    </a>`).join('');
  empty.style.display = list.length ? 'none' : 'block';
  countEl.textContent = `共 ${tools.length} 款工具 · 当前显示 ${list.length} 款`;
}

search.addEventListener('input', render);
tagsEl.addEventListener('click', e => {
  const t = e.target.closest('.tag'); if (!t) return;
  activeTag = t.dataset.c;
  document.querySelectorAll('.tag').forEach(x => x.classList.toggle('active', x === t));
  render();
});

render();
</script>
</body>
</html>
