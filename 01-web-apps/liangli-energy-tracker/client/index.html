<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/client/src/index.css">
  <style>
    [data-custom-element*="watermark" i] {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      overflow: hidden !important;
    }
  </style>
  <script>
    (function() {
      function removeWm() {
        try {
          var els = document.querySelectorAll('[data-custom-element*="watermark" i]');
          for (var i = 0; i < els.length; i++) {
            els[i].style.display = 'none';
          }
        } catch(e) {}
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', removeWm);
      } else {
        removeWm();
      }
      var mo = new MutationObserver(removeWm);
      mo.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-custom-element'] });
      setInterval(removeWm, 2000);
    })();
  </script>
  <title>量力 - 精力管理与个人成长</title>
  <script>
    try {
      window.__platform__ = JSON.parse('{{{__platform__}}}');
    } catch (e) {
      console.error('Failed to parse __platform__', e);
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/client/src/index.tsx"></script>
</body>

</html>
