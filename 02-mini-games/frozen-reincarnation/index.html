<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>凛冬轮回 · 独自求生</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1628'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='%235ec8f8'%3E%E2%9D%84%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============ 设计系统 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#050b14;--bg2:#0a1422;--card:rgba(17,32,54,.78);--card-solid:#112036;
  --line:rgba(94,200,248,.14);--line-bright:rgba(94,200,248,.35);
  --ice:#5ec8f8;--ice2:#2aa0d8;--ice-dim:#1a4a66;
  --ember:#ff7a45;--ember-dim:#c44a20;
  --gold:#ffd56a;--red:#ff5c5c;--green:#5ed19a;--violet:#b39cff;--pink:#ff9ec6;
  --text:#e8f3ff;--dim:#8aa5c0;--faint:#4d6884;
  --serif:'Noto Serif SC',serif;--sans:'Noto Sans SC',-apple-system,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--sans);background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.6;user-select:none;-webkit-user-select:none;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(94,200,248,.10), transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 110%, rgba(94,156,255,.06), transparent 60%),
    var(--bg);
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto}

/* ============ 顶栏 ============ */
#topbar{
  flex-shrink:0;padding:8px 12px 6px;background:linear-gradient(180deg,rgba(17,32,54,.95),rgba(10,20,34,.75));
  border-bottom:1px solid var(--line);backdrop-filter:blur(12px);
}
#topbar .row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
#tb-day{font-family:var(--serif);font-weight:900;font-size:15px;color:var(--ice);letter-spacing:1px}
#tb-weather{font-size:11px;color:var(--dim)}
#tb-money{font-family:monospace;font-weight:700;font-size:15px;color:var(--gold)}
.bars{display:flex;gap:8px}
.bar{flex:1;display:flex;align-items:center;gap:5px}
.bar .ic{font-size:11px;width:16px;text-align:center}
.bar .track{flex:1;height:8px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;position:relative}
.bar .fill{height:100%;border-radius:4px;transition:width .3s}
.bar .num{font-size:9px;color:var(--dim);font-family:monospace;width:44px;text-align:right}
#fill-sta{background:linear-gradient(90deg,#2aa0d8,#5ec8f8)}
#fill-hp{background:linear-gradient(90deg,#c0392b,#ff5c5c)}
#fill-mood{background:linear-gradient(90deg,#c78ad8,#ff9ec6)}

/* ============ 任务卡 ============ */
#quest{
  flex-shrink:0;margin:8px 12px 0;padding:9px 12px;border-radius:10px;cursor:pointer;
  background:linear-gradient(90deg,rgba(255,213,106,.10),rgba(255,213,106,.03));
  border:1px solid rgba(255,213,106,.25);display:flex;align-items:center;gap:9px;
}
#quest .qic{font-size:16px}
#quest .qtx{flex:1;font-size:11px;line-height:1.4}
#quest .qtx b{color:var(--gold);font-size:12px}
#quest .qpr{font-family:monospace;font-size:11px;color:var(--gold)}

/* ============ 主区 ============ */
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 12px 12px;scroll-behavior:smooth}
#main::-webkit-scrollbar{width:3px}
#main::-webkit-scrollbar-thumb{background:var(--line-bright);border-radius:2px}

/* 场景图 */
#scene{
  position:relative;height:158px;border-radius:14px;overflow:hidden;margin-bottom:10px;
  border:1px solid var(--line);box-shadow:0 6px 28px rgba(0,0,0,.45);
  background-size:cover;background-position:center;transition:background-image .4s;
}
#scene::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(5,11,20,.88))}
#scene .loc-name{position:absolute;left:14px;bottom:10px;z-index:1;font-family:var(--serif);font-size:21px;font-weight:900;letter-spacing:3px;text-shadow:0 2px 8px #000}
#scene .loc-sub{position:absolute;left:14px;bottom:34px;z-index:1;font-size:10px;color:var(--ice);letter-spacing:2px}
#scene .loc-tip{position:absolute;right:12px;bottom:12px;z-index:1;font-size:10px;color:var(--dim);max-width:45%;text-align:right}

/* ============ 行动按钮 ============ */
.act{
  display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;margin:0 0 8px;
  background:linear-gradient(180deg,rgba(42,80,120,.38),rgba(20,40,68,.38));
  border:1px solid var(--line-bright);border-radius:11px;color:var(--text);
  font-size:13px;cursor:pointer;text-align:left;transition:all .15s;font-family:var(--sans);
}
.act:hover{background:rgba(94,200,248,.12);border-color:var(--ice)}
.act:active{transform:scale(.985)}
.act:disabled{opacity:.38;cursor:not-allowed}
.act .ic{font-size:19px;width:26px;text-align:center;flex-shrink:0}
.act .tx{flex:1;min-width:0}
.act .nm{font-weight:700;font-size:13px}
.act .ds{font-size:10px;color:var(--dim);line-height:1.35;margin-top:1px}
.act .meta{text-align:right;flex-shrink:0;font-family:monospace}
.act .sta{font-size:11px;color:var(--ice);font-weight:700}
.act .gain{font-size:9px;color:var(--faint)}
.act.sleep{background:linear-gradient(180deg,rgba(196,74,32,.55),rgba(120,40,15,.55));border-color:var(--ember)}
.act.sleep:hover{background:var(--ember);box-shadow:0 0 14px rgba(255,122,69,.35)}
.act .nm .tag{font-size:9px;color:var(--gold);border:1px solid rgba(255,213,106,.4);border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px}

/* ============ 底栏导航 ============ */
#navbar{
  flex-shrink:0;display:flex;overflow-x:auto;background:rgba(10,20,34,.92);
  border-top:1px solid var(--line);backdrop-filter:blur(14px);
  scrollbar-width:none;padding-bottom:env(safe-area-inset-bottom);
}
#navbar::-webkit-scrollbar{display:none}
.nav-it{
  flex:1;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:8px 2px 7px;color:var(--faint);cursor:pointer;border:none;background:none;
  font-family:var(--sans);font-size:9px;transition:color .15s;letter-spacing:1px;
}
.nav-it .ic{font-size:18px;filter:grayscale(.7) opacity(.6);transition:all .15s}
.nav-it.on{color:var(--ice)}
.nav-it.on .ic{filter:none;transform:translateY(-1px) scale(1.12)}

/* ============ 通用组件 ============ */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;backdrop-filter:blur(14px)}
.ptitle{font-size:12px;font-weight:700;color:var(--ice);margin-bottom:10px;display:flex;align-items:center;gap:8px;letter-spacing:1px}
.ptitle::before{content:'';width:3px;height:13px;background:linear-gradient(180deg,var(--ice),var(--ice2));border-radius:2px;box-shadow:0 0 6px var(--ice)}
.ptitle .right{margin-left:auto;font-weight:400;font-size:10px;color:var(--faint)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;margin:6px 0;
  background:linear-gradient(180deg,rgba(42,80,120,.4),rgba(20,40,68,.4));border:1px solid var(--line-bright);
  border-radius:10px;color:var(--text);font-size:13px;cursor:pointer;transition:all .15s;font-family:var(--sans)}
.btn:hover{background:rgba(94,200,248,.12);border-color:var(--ice)}
.btn.ember{background:linear-gradient(180deg,rgba(196,74,32,.5),rgba(120,40,15,.5));border-color:var(--ember);font-weight:700}
.btn.ember:hover{background:var(--ember);box-shadow:0 0 16px rgba(255,122,69,.4)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-family:monospace;margin:2px 3px 2px 0;background:rgba(94,200,248,.1);border:1px solid var(--line)}
.statrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.06);font-size:12px}
.statrow:last-child{border-bottom:none}
.statrow .k{color:var(--dim)}
.statrow .v{font-family:monospace;font-weight:700}
.attrbar{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.attrbar .ak{width:34px;font-size:11px;color:var(--dim)}
.attrbar .track{flex:1;height:7px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden}
.attrbar .fill{height:100%;background:linear-gradient(90deg,var(--ice2),var(--ice));border-radius:4px}
.attrbar .av{width:26px;text-align:right;font-family:monospace;font-size:11px;color:var(--ice)}

/* 模态 */
#mmask{position:fixed;inset:0;z-index:60;background:rgba(3,7,14,.78);display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px)}
#mbox{background:var(--card-solid);border:1px solid var(--line-bright);border-radius:14px;padding:18px;max-width:440px;width:100%;max-height:82vh;overflow-y:auto;animation:mIn .22s ease}
@keyframes mIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:70;background:rgba(17,32,54,.96);border:1px solid var(--ice);color:var(--text);
  padding:8px 18px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:0 4px 18px rgba(0,0,0,.5);max-width:86%;text-align:center}
#toast.show{opacity:1}
.ach-toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:70;display:flex;gap:11px;align-items:center;
  background:rgba(17,32,54,.97);border:1px solid var(--gold);border-radius:12px;padding:11px 16px;animation:mIn .3s ease;box-shadow:0 6px 24px rgba(0,0,0,.6)}

/* 战斗 */
.foe{text-align:center;padding:10px 0}
.foe img{width:150px;height:150px;object-fit:cover;border-radius:12px;border:2px solid var(--line-bright);box-shadow:0 6px 24px rgba(0,0,0,.5)}
.foe .fname{font-family:var(--serif);font-size:18px;font-weight:900;margin:8px 0 2px}
.fhpbar{height:10px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;margin:8px 0}
.fhpbar .f{height:100%;background:linear-gradient(90deg,#c0392b,#ff5c5c);transition:width .3s}
.dmg-float{position:fixed;z-index:80;font-family:monospace;font-weight:900;font-size:20px;pointer-events:none;animation:dmgUp .9s ease forwards;text-shadow:0 2px 4px #000}
@keyframes dmgUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-44px)}}

/* AVG 开场 */
#avg{position:fixed;inset:0;z-index:50;background:rgba(3,7,14,.9);display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 8vh;cursor:pointer}
#avg .line{max-width:520px;margin:0 auto;padding:14px 24px;font-family:var(--serif);font-size:17px;line-height:1.9;letter-spacing:1px;text-shadow:0 2px 8px #000;animation:mIn .5s ease}
#avg .hint{position:absolute;bottom:26px;right:26px;font-size:11px;color:var(--faint);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.2}}

/* 启动页 */
.hero{padding:44px 20px 30px;text-align:center}
.hero h1{font-family:var(--serif);font-size:38px;font-weight:900;letter-spacing:6px;margin-bottom:5px;text-shadow:0 0 24px rgba(94,200,248,.5)}
.hero .sub{font-size:10px;letter-spacing:3px;color:var(--faint);margin-bottom:22px}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shop-item{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:11px;text-align:center;cursor:pointer;transition:all .15s}
.shop-item:hover{border-color:var(--ice)}
.shop-item.owned{border-color:var(--green);opacity:.7;cursor:default}
.shop-item .si{font-size:22px}
.shop-item .sn{font-size:12px;font-weight:700;margin:3px 0 2px}
.shop-item .sd{font-size:9px;color:var(--dim);line-height:1.4}
.shop-item .sp{font-family:monospace;font-size:11px;color:var(--gold);margin-top:4px}
.petcard{display:flex;gap:11px;align-items:center;background:rgba(255,158,198,.06);border:1px solid rgba(255,158,198,.25);border-radius:11px;padding:10px 12px}
.petcard img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid rgba(255,158,198,.4)}
@media (max-height:640px){#scene{height:120px}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar" style="display:none">
    <div class="row1">
      <span id="tb-day">第 1 天</span>
      <span id="tb-weather">☀ 晴</span>
      <span id="tb-money">¥200</span>
    </div>
    <div class="bars">
      <div class="bar"><span class="ic">⚡</span><div class="track"><div class="fill" id="fill-sta"></div></div><span class="num" id="num-sta"></span></div>
      <div class="bar"><span class="ic">❤</span><div class="track"><div class="fill" id="fill-hp"></div></div><span class="num" id="num-hp"></span></div>
      <div class="bar"><span class="ic">☺</span><div class="track"><div class="fill" id="fill-mood"></div></div><span class="num" id="num-mood"></span></div>
    </div>
  </div>
  <div id="quest" style="display:none" onclick="openTerminal('quest')"></div>
  <div id="main"></div>
  <div id="navbar" style="display:none"></div>
</div>
<div id="toast"></div>

<script>
/* ============================================================
   凛冬轮回 v3.0 · 独自求生
   玩法参考《我独自生活 2.0》：体力制日常 / 地点导航 / 属性养成
   主线任务 / 末日终端 / 救济低保 / 隐藏成就 + 轮回继承
   ============================================================ */

// ===== 工具 =====
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const chance=p=>Math.random()<p;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[rnd(a.length)];
const save=()=>{try{localStorage.setItem('frozen_v3',JSON.stringify(G))}catch(e){}};
const load=()=>{try{const s=localStorage.getItem('frozen_v3');return s?JSON.parse(s):null}catch(e){return null}};

// ===== 音效（Web Audio 合成） =====
let audioCtx=null;
function beep(freq,dur=0.08,type='sine',vol=0.12){
  if(!G.set||!G.set.sound)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
const sfx={
  click:()=>beep(600,.05,'sine',.07),
  good:()=>{beep(660,.08,'sine',.1);setTimeout(()=>beep(880,.1,'sine',.1),80)},
  bad:()=>{beep(200,.15,'sawtooth',.1);setTimeout(()=>beep(150,.2,'sawtooth',.09),100)},
  buy:()=>{beep(880,.06,'sine',.09);setTimeout(()=>beep(1100,.08,'sine',.09),60)},
  hit:()=>beep(120,.15,'sawtooth',.18),
  sleep:()=>{beep(440,.2,'sine',.08);setTimeout(()=>beep(330,.3,'sine',.08),180)},
  win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15,'sine',.11),i*100))},
};

// ===== 默认状态 =====
const DEF={
  v:3, screen:'title',           // title | game | dead
  cycle:1, origin:0,             // 第几世 / 本源点
  day:1, maxDay:30,
  sta:100, staMax:100,
  hp:100, mood:75, money:200,
  food:2, meds:0, fuel:1,
  attr:{str:0,int:0,dex:0,cha:0,sur:0},   // 体能/智力/手艺/魅力/生存
  baseLv:1, loc:'home',
  weather:'clear',
  farm:{plots:0,crops:[]},       // 农田：块数 / 作物生长天数
  pet:null,                      // {name,img,power}
  reliefUsed:0, reliefLastDay:0, // 救济
  quests:[], questDone:[],
  ach:[], endings:[], talents:[], starter:null,
  run:{runs:0,books:0,jobs:0,cooks:0,harvests:0,kills:0,reliefs:0,reliefMonths:[],explores:0},
  market:[], marketDay:0,
  flags:{}, set:{sound:true},
  stats:{bestMoney:0,bestDay:0,totalCycles:0},
};
let G=load()||JSON.parse(JSON.stringify(DEF));

// ===== 天赋定义（本源商店） =====
const TALENTS=[
  {id:'athlete',icon:'🏃',name:'运动员',desc:'初始体力上限 +30',cost:40},
  {id:'trader',icon:'💼',name:'商业头脑',desc:'所有卖出价格 +25%',cost:40},
  {id:'thick',icon:'🥣',name:'厚脸皮',desc:'救济站救济金翻倍',cost:25},
  {id:'scholar',icon:'📖',name:'学者',desc:'智力成长双倍',cost:50},
  {id:'warmbody',icon:'🔥',name:'抗寒体质',desc:'缺燃料时健康损耗减半',cost:30},
  {id:'lucky',icon:'🍀',name:'幸运儿',desc:'探索与闲逛更容易遇到好事',cost:45},
];
const STARTERS=[
  {id:'cash',icon:'💰',name:'现金包',desc:'开局 +¥500'},
  {id:'supply',icon:'🎒',name:'物资包',desc:'开局 +8食物 +3药品 +3燃料'},
  {id:'gym',icon:'🏋',name:'健身卡',desc:'开局体力上限 +40'},
];

// ===== 成就定义 =====
const ACH=[
  {id:'first',name:'初入凛冬',desc:'完成第一世轮回',icon:'❄'},
  {id:'strong',name:'偷偷变强',desc:'累计跑步锻炼 100 次',icon:'🏃'},
  {id:'relief2',name:'梅开二度',desc:'连续两个月都领了救济',icon:'🥣'},
  {id:'worker',name:'打工人',desc:'累计打工 30 次',icon:'🧱'},
  {id:'rich',name:'万元户',desc:'单世存款达到 ¥3000',icon:'💰'},
  {id:'hunter',name:'冰原猎手',desc:'累计击杀 5 只异兽',icon:'⚔'},
  {id:'cook',name:'饱腹之人',desc:'累计做饭 20 次',icon:'🍲'},
  {id:'reader',name:'博览群书',desc:'累计看书 50 次',icon:'📚'},
  {id:'farmer',name:'末世农夫',desc:'累计收获 5 次作物',icon:'🌾'},
  {id:'petter',name:'铲屎官',desc:'收养一只宠物',icon:'🐾'},
  {id:'survivor',name:'活着',desc:'第一次活到大寒潮',icon:'📅'},
  {id:'maxed',name:'六边形战士',desc:'五维全部达到 60',icon:'💎'},
];
function unlockAch(id){
  if(G.ach.includes(id))return;
  G.ach.push(id);
  const a=ACH.find(x=>x.id===id);if(!a)return;
  const t=document.createElement('div');t.className='ach-toast';
  t.innerHTML=`<div style="font-size:26px">${a.icon}</div><div><div style="font-size:9px;color:var(--gold)">成就解锁</div><div style="font-size:14px;font-weight:700">${a.name}</div><div style="font-size:10px;color:var(--dim)">${a.desc}</div></div>`;
  document.body.appendChild(t);sfx.win();setTimeout(()=>t.remove(),2800);save();
}

// ===== 主线任务链 =====
const QUESTS=[
  {id:'q1',name:'挣到第一桶金',desc:'去任意地点打工 1 次',ck:()=>G.run.jobs>=1,reward:{money:30}},
  {id:'q2',name:'小有积蓄',desc:'存款达到 ¥300',ck:()=>G.money>=300,reward:{money:50}},
  {id:'q3',name:'囤积居奇',desc:'拥有 5 个食物',ck:()=>G.food>=5,reward:{meds:1}},
  {id:'q4',name:'强身健体',desc:'体力上限达到 120',ck:()=>G.staMax>=120,reward:{money:20}},
  {id:'q5',name:'一技之长',desc:'任意属性达到 20',ck:()=>Math.max(...Object.values(G.attr))>=20,reward:{money:40}},
  {id:'q6',name:'加固避难所',desc:'避难所升到 2 级',ck:()=>G.baseLv>=2,reward:{money:60}},
  {id:'q7',name:'首次狩猎',desc:'击杀 1 只异兽',ck:()=>G.run.kills>=1,reward:{money:80}},
  {id:'q8',name:'千元身家',desc:'存款达到 ¥1000',ck:()=>G.money>=1000,reward:{money:100}},
  {id:'q9',name:'身经百战',desc:'任意属性达到 50',ck:()=>Math.max(...Object.values(G.attr))>=50,reward:{money:150}},
  {id:'q10',name:'迎接大寒潮',desc:'活到第 30 天',ck:()=>G.day>=30,reward:{}},
];
function curQuest(){return QUESTS.find(q=>!G.questDone.includes(q.id))||null}
function checkQuests(){
  const q=curQuest();if(!q)return;
  if(q.ck()){
    G.questDone.push(q.id);
    const r=q.reward||{};
    if(r.money)G.money+=r.money;
    if(r.meds)G.meds+=r.meds;
    toast(`✅ 任务完成「${q.name}」${r.money?` +¥${r.money}`:''}${r.meds?` +${r.meds}药品`:''}`);
    sfx.good();
  }
}

// ===== 飘字 / toast =====
function floatDmg(text,color){
  const d=document.createElement('div');d.className='dmg-float';d.textContent=text;
  d.style.color=color||'#ff5c5c';d.style.left=(38+Math.random()*24)+'%';d.style.top='38%';
  document.body.appendChild(d);setTimeout(()=>d.remove(),950);
}
function toast(m){
  const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700);
}
function showModal(h){
  closeModal();
  const m=document.createElement('div');m.id='mmask';
  m.innerHTML=`<div id="mbox">${h}</div>`;
  m.onclick=e=>{if(e.target===m)closeModal()};
  document.body.appendChild(m);
}
function closeModal(){const m=$('#mmask');if(m)m.remove()}

// ===== 属性成长（含天赋加成） =====
function gainAttr(k,v){
  if(k==='int'&&G.talents.includes('scholar'))v*=2;
  const before=G.attr[k];
  G.attr[k]=clamp(G.attr[k]+v,0,100);
  const names={str:'体能',int:'智力',dex:'手艺',cha:'魅力',sur:'生存'};
  if(G.attr[k]>before)floatDmg(`${names[k]} +${G.attr[k]-before}`,'#5ec8f8');
  if(Object.values(G.attr).every(x=>x>=60))unlockAch('maxed');
}
function sellPrice(base){return Math.round(base*(G.talents.includes('trader')?1.25:1))}

function refreshTop(){
  $('#tb-day').textContent=`第 ${G.day} 天 / 30`;
  const w=WEATHERS[G.weather];
  $('#tb-weather').textContent=w.n+(G.weather==='storm'?'（不宜远行）':'');
  $('#tb-money').textContent='¥'+G.money;
  $('#fill-sta').style.width=(G.sta/G.staMax*100)+'%';

function renderNav(){

// ===== 地点切换 =====
function goLoc(k){
  if(G.screen!=='game')return;
  G.loc=k;sfx.click();render();
}

// ===== 行动统一入口 =====
function doAct(id){
  const a=G.attr;
  const spend=n=>{G.sta=clamp(G.sta-n,0,G.staMax)};
  const pay=n=>{G.money=Math.max(0,G.money+n)};
  switch(id){
    // ---- 家 ----
    case 'sleep':doSleep();return;
    case 'cook':{
      if(G.food<1){toast('没有食物了');return}
      spend(10);G.food--;G.hp=clamp(G.hp+8,0,100);G.mood=clamp(G.mood+5,0,100);
      gainAttr('dex',1);G.run.cooks++;if(G.run.cooks>=20)unlockAch('cook');
      log('做了一顿热饭，胃里暖暖的。');sfx.good();break;
    }
    case 'read':{
      spend(15);gainAttr('int',2);G.mood=clamp(G.mood+2,0,100);G.run.books++;
      if(G.run.books>=50)unlockAch('reader');
      log('读了一会儿书，心里平静了些。');sfx.click();break;
    }
    case 'fortify':{
      const cost=G.baseLv*150;
      if(G.money<cost){toast('钱不够');return}
      spend(20);G.money-=cost;G.baseLv++;
      log(`避难所加固到 Lv.${G.baseLv}，更有安全感了。`);sfx.buy();break;
    }
    case 'rest':{spend(5);G.mood=clamp(G.mood+6,0,100);log('烤着火发了一会儿呆。');sfx.click();break}
    // ---- 集市 ----
    case 'sell':{
      if(G.food<2){toast('食物不足2个');return}
      spend(15);G.food-=2;const v=sellPrice(50+a.cha);pay(v);
      log(`摆摊卖掉了存粮，收入 ¥${v}。`);sfx.buy();floatDmg(`+¥${v}`,'#ffd56a');break;
    }
    case 'job_market':{spend(20);const v=sellPrice(40+a.cha);pay(v);jobDone();log(`在集市打零工，赚了 ¥${v}。`);floatDmg(`+¥${v}`,'#ffd56a');break}
    case 'relief':{
      const thick=G.talents.includes('thick');
      const money=thick?160:80,food=thick?4:2;
      pay(money);G.food+=food;G.reliefLastDay=G.day;G.run.reliefs++;
      const month=Math.ceil(G.day/10);
      G.run.reliefMonths.push(month);
      const ms=G.run.reliefMonths;
      if(ms.length>=2&&ms[ms.length-1]===ms[ms.length-2]+1)unlockAch('relief2');
      log(`领了救济：¥${money} 和 ${food} 份食物。有点不好意思，但活着要紧。`);sfx.good();break;
    }
    case 'wander':wanderEvent();break;
    // ---- 工地 ----
    case 'job_con':{spend(30);const v=sellPrice(55+a.str);pay(v);gainAttr('str',1);jobDone();log(`搬了一天砖，赚了 ¥${v}，腰酸背痛。`);floatDmg(`+¥${v}`,'#ffd56a');break}
    case 'learn_dex':{spend(20);gainAttr('dex',2);log('跟老师傅学了几手修理活。');sfx.click();break}
    case 'scrap':{
      spend(15);
      if(chance(.4)){G.fuel++;log('在废料堆里找到半桶还能用的燃料。');floatDmg('+1燃料','#5ec8f8')}
      else{const v=10+rnd(21);pay(v);log(`捡了些废铁，卖了 ¥${v}。`);floatDmg(`+¥${v}`,'#ffd56a')}
      sfx.click();break;
    }
    // ---- 超市 ----
    case 'buy_food':openShop('food');return;
    case 'job_mart':{spend(20);const v=sellPrice(38+a.cha);pay(v);gainAttr('cha',1);jobDone();log(`站了一天收银台，赚了 ¥${v}。`);floatDmg(`+¥${v}`,'#ffd56a');break}
    case 'expired':{
      spend(10);
      if(chance(.35+a.cha/300)){G.food++;log('翻到一箱刚过期的罐头，店员睁一只眼闭一只眼。');floatDmg('+1食物','#5ed19a');sfx.good()}
      else{G.mood=clamp(G.mood-5,0,100);log('被店员当场抓获，灰溜溜地走了。');sfx.bad()}
      break;
    }
    // ---- 药店 ----
    case 'buy_meds':{
      if(G.money<40){toast('钱不够（¥40）');return}
      G.money-=40;G.meds++;log('买了一盒常备药。');sfx.buy();break;
    }
    case 'heal':{
      if(G.meds<1){toast('没有药品');return}
      G.meds--;G.hp=clamp(G.hp+25,0,100);log('吃了药，感觉好多了。');sfx.good();break;
    }
    case 'job_pha':{spend(20);const v=sellPrice(38+a.int);pay(v);gainAttr('int',1);jobDone();log(`整理了一天药材，赚了 ¥${v}。`);floatDmg(`+¥${v}`,'#ffd56a');break}
    case 'learn_med':{spend(20);gainAttr('int',2);log('听药剂师讲了一下午药理。');sfx.click();break}
    // ---- 加油站 ----
    case 'buy_fuel':{
      if(G.money<30){toast('钱不够（¥30）');return}
      G.money-=30;G.fuel++;log('买了一桶燃料。');sfx.buy();break;
    }
    case 'job_gas':{spend(20);const v=sellPrice(40+a.str);pay(v);gainAttr('str',1);jobDone();log(`在加油站干杂活，赚了 ¥${v}。`);floatDmg(`+¥${v}`,'#ffd56a');break}
    case 'siphon':{
      spend(15);
      if(chance(.45)){G.fuel++;log('从一辆废弃车里抽出了小半桶油。');floatDmg('+1燃料','#5ec8f8');sfx.good()}
      else if(chance(.5)){const v=15+rnd(26);pay(v);log(`在车里翻到一个钱包，¥${v}。`);floatDmg(`+¥${v}`,'#ffd56a')}
      else{G.hp=clamp(G.hp-5,0,100);log('油箱是空的，还划破了手。');sfx.bad()}
      break;
    }
    // ---- 郊区 ----
    case 'run':{
      spend(20);G.staMax=clamp(G.staMax+2,100,200);gainAttr('str',1);G.run.runs++;
      if(G.run.runs>=100)unlockAch('strong');
      log(`迎着风雪跑了 3000 米（第 ${G.run.runs} 次），体力上限 +2。`);sfx.good();break;
    }
    case 'farm_open':{spend(30);G.farm.plots++;log(`开垦出第 ${G.farm.plots} 块田。冻土硬得像石头。`);sfx.click();break}
    case 'farm_seed':{spend(10);G.farm.crops.push(0);log('种下几株耐寒果苗，希望能活。');sfx.click();break}
    case 'farm_harvest':{
      const ready=G.farm.crops.filter(c=>c>=3).length;
      G.farm.crops=G.farm.crops.filter(c=>c<3);
      G.run.harvests+=ready;if(G.run.harvests>=5)unlockAch('farmer');
      showModal(`<div class="ptitle">收获 ${ready} 块田</div>
        <p style="font-size:12px;color:var(--dim);margin-bottom:12px">果苗结出了冻梨，怎么处理？</p>
        <button class="btn" onclick="harvestAs(${ready},'food')">🍐 留下吃（食物 +${ready*4}）</button>
        <button class="btn" onclick="harvestAs(${ready},'money')">💰 拿去卖（+¥${sellPrice(ready*60)}）</button>`);
      return;
    }
    case 'sun':{spend(5);G.mood=clamp(G.mood+5,0,100);log('晒了会儿太阳，雪地里眯起眼睛。');sfx.click();break}
    // ---- 废墟 ----
    case 'explore':explore(false);return;
    case 'explore_deep':explore(true);return;
  }
  afterAct();
}
function jobDone(){

const BEASTS=[

function explore(deep){
  G.sta=clamp(G.sta-(deep?30:25),0,G.staMax);
  G.run.explores++;
  const sur=G.attr.sur,lucky=G.talents.includes('lucky');
  const beastP=(deep?.42:.25)-sur/400-(lucky?.06:0);
  if(chance(beastP)){
    const pool=BEASTS.filter(b=>sur>=b.minSur);
    startBattle(pick(pool));return;
  }
  if(chance(deep?.3:.18)){wandererEvent();return}
  if(!G.pet&&chance(.1+sur/500)){petEvent();return}
  // 战利品
  const tier=deep?2:1;
  const roll=Math.random()+sur/250+(lucky?.1:0);
  if(roll>1.05){
    const v=sellPrice((60+rnd(80))*tier);G.money+=v;G.food+=tier;
    toast(`找到一处完好的储藏点！¥${v} + ${tier}食物`);sfx.good();
  }else if(roll>.7){
    G.food+=2*tier;G.fuel+=tier;
    toast(`搜刮到补给：${2*tier}食物 + ${tier}燃料`);floatDmg('+补给','#5ed19a');
  }else if(roll>.4){
    G.fuel+=tier;G.meds+=chance(.4)?1:0;
    toast('翻出一些燃料和杂物。');
  }else{
    G.mood=clamp(G.mood-4,0,100);G.hp=clamp(G.hp-4,0,100);
    toast('一无所获，还摔进了雪坑。');sfx.bad();

  afterAct();
}

// ===== 回合制战斗 =====
let BS=null;
function startBattle(b){
  BS={foe:{...b,maxHp:b.hp},turn:1};
  document.body.classList.add('in-battle');
  showModal(battleHTML());
  sfx.hit();
}
function battleHTML(){
  const f=BS.foe;
  return `<div class="foe">
    <img src="${f.img}" alt="">
    <div class="fname">${f.name}</div>
    <div style="font-size:10px;color:var(--dim)">攻击 ${f.atk} · 第 ${BS.turn} 回合</div>
    <div class="fhpbar"><div class="f" style="width:${f.hp/f.maxHp*100}%"></div></div>
    <div style="font-size:11px;font-family:monospace;margin-bottom:10px">敌方 ${Math.max(0,f.hp)}/${f.maxHp}　|　你 ❤${G.hp} ⚡${G.sta}</div>
    <button class="btn ember" onclick="battleHit()">⚔ 攻击</button>
    <button class="btn" onclick="battleFlee()">🏃 逃跑（体能判定）</button>
  </div>`;
}
function battleHit(){
  const f=BS.foe;
  let dmg=8+Math.floor(G.attr.str/3)+rnd(6);
  if(G.pet)dmg+=G.pet.power;
  f.hp-=dmg;sfx.hit();floatDmg(`-${dmg}`,'#ff7a45');
  if(f.hp<=0){battleWin();return}
  const edmg=Math.max(1,f.atk+ rnd(5)-Math.floor(G.attr.str/6));
  G.hp=clamp(G.hp-edmg,0,100);floatDmg(`-${edmg}❤`,'#ff5c5c');
  if(G.hp<=0){closeModal();BS=null;gameOver('beast');return}
  BS.turn++;
  $('#mbox').innerHTML=battleHTML();
}
function battleFlee(){
  if(chance(.45+G.attr.str/200)){
    toast('你甩开了它，逃回了避难所。');closeModal();BS=null;
    G.loc='home';afterAct();
  }else{
    const f=BS.foe;const edmg=f.atk+rnd(5);
    G.hp=clamp(G.hp-edmg,0,100);floatDmg(`-${edmg}❤`,'#ff5c5c');
    if(G.hp<=0){closeModal();BS=null;gameOver('beast');return}
    toast('没跑掉，被它扑了一下！');
    $('#mbox').innerHTML=battleHTML();
  }
}
function battleWin(){
  const f=BS.foe;closeModal();BS=null;
  G.run.kills++;G.food+=3;const v=sellPrice(40+rnd(40));G.money+=v;
  gainAttr('sur',2);gainAttr('str',1);
  if(G.run.kills>=5)unlockAch('hunter');
  toast(`击杀了${f.name}！兽肉 +3食物，兽皮卖了 ¥${v}`);sfx.win();
  afterAct();
}

   ============================================================ */
function rollWeather(){
  const r=Math.random();
  if(G.day>=29)return 'storm';
  if(r<.4)return 'clear';
  if(r<.65)return 'cloudy';
  if(r<.88)return 'snow';
  return 'storm';
}
function tomorrowWeather(){
  // 预报：基于今天的伪随机推演（简单近似）
  const r=(Math.sin(G.day*99.7)+1)/2;
  if(G.day+1>=30)return 'storm';
  if(r<.4)return 'clear';if(r<.65)return 'cloudy';if(r<.88)return 'snow';return 'storm';
}
function doSleep(){
  let report=[];
  // 吃食
  if(G.food>=1){G.food--;report.push('🍞 吃了晚饭')}
  else{G.hp-=12;G.mood-=10;report.push('😖 饿着肚子入睡（-12❤ -10☺）')}
  // 取暖
  if(G.fuel>=1){G.fuel--;report.push('🔥 烧了一晚燃料')}
  else{const d=G.talents.includes('warmbody')?4:8;G.hp-=d;report.push(`🥶 没有燃料，冻得发抖（-${d}❤）`)}
  // 心情微调
  if(G.flags.coat){G.mood+=3;report.push('🧥 兽皮大衣很暖和（+3☺）')}
  if(G.flags.radio&&chance(.5)){G.mood+=2;report.push('📻 收音机里传来老歌（+2☺）')}
  if(G.pet){G.mood+=6;report.push(`🐾 ${G.pet.name} 蜷在你脚边（+6☺）`)}
  // 基地维护费（每10天）
  if(G.day%10===0){
    const fee=Math.ceil(G.day/10)*120;
    if(G.money>=fee){G.money-=fee;report.push(`🧾 交了避难所维护费 ¥${fee}`)}
    else{G.hp-=15;G.mood-=15;report.push(`🧾 交不起 ¥${fee} 维护费，被断了供暖（-15❤ -15☺）`)}
  }
  // 农田生长
  G.farm.crops=G.farm.crops.map(c=>c+1);
  // 心情健康夹取
  G.mood=clamp(G.mood,0,100);G.hp=clamp(G.hp,0,100);
  // 死亡判定
  if(G.hp<=0){gameOver('cold');return}
  sfx.sleep();
  showModal(`<div class="ptitle">🌙 第 ${G.day} 天结束了</div>
    <div style="font-size:12px;line-height:2;color:var(--dim)">${report.map(r=>r+'<br>').join('')}</div>
    <button class="btn ember" style="margin-top:12px" onclick="nextDay()">☀ 迎接第 ${G.day+1} 天</button>`);
}

/* ============================================================
   大寒潮 · 结局
   ============================================================ */
const ENDINGS={
  rich:{name:'凛冬首富',icon:'💰',desc:'寒潮来临时，你的避难所里堆满了物资和现金。你不仅活了下来，还成了灾后集市上最有话语权的人。'},
  fortress:{name:'钢铁堡垒',icon:'🏰',desc:'你把避难所打造成了一座真正的堡垒。大寒潮撞在你的加厚钢门上，连一丝寒风都钻不进来。'},
  scholar:{name:'末世学者',icon:'📚',desc:'你在烛光下读完了避难所里所有的书。寒潮过后，你写下的《凛冬生存笔记》成了幸存者们的圣经。'},
  hunter:{name:'冰原猎王',icon:'⚔',desc:'你猎杀的异兽皮毛铺满了地板。对你而言，大寒潮不过是又一场稍微大些的风雪。'},
  warm:{name:'温暖小家',icon:'🐾',desc:'壁炉、热汤、蜷在脚边的伙伴。外面的世界冰封千里，你的小屋里却一直是春天。'},
  alive:{name:'活着',icon:'🌅',desc:'你没有惊人的成就，但你活到了寒潮结束。在凛冬里，活着本身就是最大的胜利。'},
  cold:{name:'长眠',icon:'🪦',desc:'在一个没有燃料的夜里，你蜷缩着睡去，再也没有醒来。雪落无声。'},
  beast:{name:'兽腹',icon:'💀',desc:'废墟深处，你成了异兽的口粮。凛冬从不同情弱者。'},
};
function triggerFinal(){
  // 寒潮考验
  let passed=true,dmgNote='';
  const fort=G.baseLv*4+(G.talents.includes('warmbody')?5:0);
  const coldDmg=Math.max(0,45-fort-Math.floor(G.attr.str/3));
  if(coldDmg>0){G.hp-=coldDmg;dmgNote=`寒潮中你受到了 ${coldDmg} 点严寒伤害。`}
  if(G.hp<=0)passed=false;
  let eid;
  if(!passed)eid='cold';
  else if(G.money>=3000)eid='rich';
  else if(G.baseLv>=5)eid='fortress';
  else if(G.attr.int>=80)eid='scholar';
  else if(G.run.kills>=5)eid='hunter';
  else if(G.pet&&G.mood>=70)eid='warm';
  else eid='alive';
  gameOver(eid,dmgNote);
}
function gameOver(eid,extra){
  const E=ENDINGS[eid];
  if(!G.endings.includes(eid))G.endings.push(eid);
  const dead=(eid==='cold'||eid==='beast');
  // 本源点结算
  const attrSum=Object.values(G.attr).reduce((a,b)=>a+b,0);
  const origin=Math.floor(attrSum/5)+Math.floor(G.money/200)+G.questDone.length*8+G.ach.length*12+(dead?0:25);
  G.origin+=origin;
  G.stats.totalCycles++;
  if(G.cycle===1)unlockAch('first');
  if(!dead)unlockAch('survivor');
  G.screen='dead';save();
  document.body.classList.remove('in-game');
  $('#topbar').style.display='none';$('#navbar').style.display='none';$('#quest').style.display='none';
  $('#main').innerHTML=`
  <div class="hero" style="padding-top:34px">
    <div style="font-size:52px;margin-bottom:8px">${E.icon}</div>
    <h1 style="font-size:30px;letter-spacing:4px">${dead?'轮回终局':'寒潮之后'}</h1>
    <div class="sub">结局 · ${E.name}</div>
  </div>
  <div class="panel" style="font-size:13px;line-height:2">${extra?`<span style="color:var(--red)">${extra}</span><br>`:''}${E.desc}</div>
  <div class="panel"><div class="ptitle">第 ${G.cycle} 世结算</div>
    <div class="statrow"><span class="k">存活天数</span><span class="v">${Math.min(G.day,30)} / 30</span></div>
    <div class="statrow"><span class="k">最终存款</span><span class="v" style="color:var(--gold)">¥${G.money}</span></div>
    <div class="statrow"><span class="k">五维总和</span><span class="v">${attrSum}</span></div>
    <div class="statrow"><span class="k">任务完成</span><span class="v">${G.questDone.length} / ${QUESTS.length}</span></div>
    <div class="statrow"><span class="k">成就</span><span class="v">${G.ach.length} / ${ACH.length}</span></div>
    <div class="statrow"><span class="k" style="color:var(--gold)">获得本源点</span><span class="v" style="color:var(--gold);font-size:16px">+${origin}</span></div>
  </div>
  <button class="btn ember" onclick="newCycle()">🌀 进入第 ${G.cycle+1} 世</button>
  <button class="btn" onclick="openShopView()">🏪 本源商店（${G.origin}点）</button>
  <button class="btn" onclick="viewAch()">🏆 成就图鉴（${G.ach.length}/${ACH.length}）</button>
  <button class="btn" onclick="viewEndings()">📖 结局图鉴（${G.endings.length}/${Object.keys(ENDINGS).length}）</button>`;
}
function newCycle(){
  const keep={cycle:G.cycle+1,origin:G.origin,ach:G.ach,endings:G.endings,talents:G.talents,starter:G.starter,set:G.set,stats:G.stats,run:G.run};
  G=JSON.parse(JSON.stringify(DEF));
  Object.assign(G,keep);
  G.run={...DEF.run,...keep.run}; // 累计型统计保留
  applyStarter();
  G.screen='game';save();
  startDay();
}
function applyStarter(){
  if(G.talents.includes('athlete'))G.staMax+=30;
  G.sta=G.staMax;
  if(G.starter==='cash')G.money+=500;
  if(G.starter==='supply'){G.food+=8;G.meds+=3;G.fuel+=3}
  if(G.starter==='gym'){G.staMax+=40;G.sta=G.staMax}
}
function startDay(){
  document.body.classList.add('in-game');
  $('#topbar').style.display='block';$('#navbar').style.display='flex';
  G.weather=rollWeather();G.loc='home';render();
}

/* ============================================================
   本源商店 / 成就 / 结局图鉴
   ============================================================ */
function openShopView(){
  let h=`<div class="panel"><div class="ptitle">🏪 本源商店<span class="right">${G.origin} 本源点</span></div>
  <div class="shopgrid">`;
  h+=TALENTS.map(t=>{
    const owned=G.talents.includes(t.id);
    return `<div class="shop-item ${owned?'owned':''}" onclick="buyTalent('${t.id}')">
      <div class="si">${t.icon}</div><div class="sn">${t.name}</div><div class="sd">${t.desc}</div>
      <div class="sp">${owned?'已拥有':t.cost+' 点'}</div></div>`;
  }).join('')+`</div></div>`;
  h+=`<div class="panel"><div class="ptitle">🎁 开局礼包（三选一，立即生效）</div><div class="shopgrid">`;
  h+=STARTERS.map(s=>{
    const sel=G.starter===s.id;
    return `<div class="shop-item ${sel?'owned':''}" onclick="chooseStarter('${s.id}')">
      <div class="si">${s.icon}</div><div class="sn">${s.name}</div><div class="sd">${s.desc}</div>
      <div class="sp">${sel?'✓ 已选':'免费'}</div></div>`;
  }).join('')+`</div></div>`;
  h+=`<button class="btn" onclick="backToEnd()">返回</button>`;
  showModal(h);
}
function buyTalent(id){
  const t=TALENTS.find(x=>x.id===id);
  if(G.talents.includes(id))return;
  if(G.origin<t.cost){toast('本源点不足');return}
  G.origin-=t.cost;G.talents.push(id);save();sfx.buy();
  toast(`获得天赋「${t.name}」`);openShopView();
}
function chooseStarter(id){G.starter=id;save();sfx.click();toast('已选开局礼包');openShopView()}
function backToEnd(){closeModal()}
function viewAch(){
  showModal(`<div class="ptitle">🏆 成就图鉴（${G.ach.length}/${ACH.length}）</div>`+
    ACH.map(a=>{const un=G.ach.includes(a.id);
      return `<div class="statrow" style="${un?'':'opacity:.4'}"><span class="k">${a.icon} ${a.name}<br><span style="font-size:9px;color:var(--faint)">${a.desc}</span></span><span class="v">${un?'✅':'🔒'}</span></div>`;
    }).join('')+`<button class="btn" style="margin-top:10px" onclick="closeModal()">关闭</button>`);
}
function viewEndings(){
  showModal(`<div class="ptitle">📖 结局图鉴（${G.endings.length}/${Object.keys(ENDINGS).length}）</div>`+
    Object.entries(ENDINGS).map(([k,e])=>{const un=G.endings.includes(k);
      return `<div class="statrow" style="${un?'':'opacity:.4'}"><span class="k">${e.icon} ${un?e.name:'???'}<br><span style="font-size:9px;color:var(--faint)">${un?e.desc:'尚未解锁'}</span></span><span class="v">${un?'✅':'🔒'}</span></div>`;
    }).join('')+`<button class="btn" style="margin-top:10px" onclick="closeModal()">关闭</button>`);
}

/* ============================================================
   启动页 + AVG 开场
   ============================================================ */
const INTRO=[
  '2047 年，凛冬纪元。',
  '大雪下了整整三个月，城市被彻底冰封。',
  '你独自躲进了一座地下避难所。',
  '30 天后，「大寒潮」将来临——足以冻结一切的极寒。',
  '白天出门谋生，夜晚回家取暖。',
  '打工、锻炼、囤货、加固……怎么活，由你决定。',
  '活下去。这是你唯一的目标。',
];
function viewTitle(){
  G.screen='title';save();
  document.body.classList.remove('in-game');
  $('#topbar').style.display='none';$('#navbar').style.display='none';$('#quest').style.display='none';
  const hasRun=G.day>1;
  $('#main').innerHTML=`
  <div class="hero">
    <svg viewBox="0 0 24 24" fill="none" stroke="#5ec8f8" stroke-width="1.5" style="width:52px;height:52px;margin:0 auto 12px;filter:drop-shadow(0 0 12px rgba(94,200,248,.6))"><path d="M12 2v20M3 6l18 12M21 6L3 18M12 2l-3 5m3-5 3 5M12 22l-3-5m3 5 3-5M5 9l-3-1m3 1 1-3M19 9l3-1m-3 1-1-3M5 15l-3 1m3-1 1 3M19 15l3 1m-3-1-1 3"/></svg>
    <h1>凛冬轮回</h1>
    <div class="sub">独自求生 · v3.0 · 第 ${G.cycle} 世</div>
    <div style="display:flex;flex-direction:column;gap:8px;max-width:300px;margin:0 auto">
      <button class="btn ember" style="padding:14px;font-size:14px" onclick="${hasRun?'continueRun()':'startIntro()'}">▶ ${hasRun?'继续第 '+G.cycle+' 世（第 '+G.day+' 天）':'开始第 '+G.cycle+' 世'}</button>
      ${hasRun?`<button class="btn" onclick="abandonRun()">🌀 放弃本世，重新轮回</button>`:''}
      <button class="btn" onclick="openShopView()">🏪 本源商店（${G.origin}点）</button>
      <button class="btn" onclick="viewAch()">🏆 成就（${G.ach.length}/${ACH.length}）</button>
      <button class="btn" onclick="viewEndings()">📖 结局图鉴（${G.endings.length}/${Object.keys(ENDINGS).length}）</button>
      <button class="btn" onclick="viewHelp()">📜 玩法说明</button>
      <button class="btn" onclick="toggleSound()">🔊 音效：${G.set.sound?'开':'关'}</button>
    </div>
    <div style="margin-top:18px;font-size:10px;color:var(--faint)">本源点 ${G.origin} · 历史最好：存活 ${G.stats.bestDay} 天 / 存款 ¥${G.stats.bestMoney}</div>
  </div>`;
}
function startIntro(){
  let i=0;
  const avg=document.createElement('div');avg.id='avg';
  document.body.appendChild(avg);
  const show=()=>{
    if(i<INTRO.length){
      avg.innerHTML=`<div class="line">${INTRO[i]}</div><div class="hint">点击继续 ▸</div>`;
      i++;beep(500+i*40,.06,'sine',.05);
    }else{
      avg.remove();startRun();
    }
  };
  avg.onclick=show;show();
}
function startRun(){
  G.screen='game';G.day=1;save();startDay();
  setTimeout(()=>toast('📜 跟随顶部任务开始你的求生'),400);
}
function continueRun(){G.screen='game';save();startDay()}
function abandonRun(){
  showModal(`<div class="ptitle">放弃本世？</div>
    <p style="font-size:12px;color:var(--dim);margin-bottom:12px">将按当前进度结算本源点，进入第 ${G.cycle+1} 世。</p>
    <button class="btn ember" onclick="closeModal();gameOver('cold')">确认放弃</button>
    <button class="btn" onclick="closeModal()">再想想</button>`);
}
function viewHelp(){
  showModal(`<div class="ptitle">📜 玩法说明</div>
  <div style="font-size:12px;line-height:1.9;color:var(--dim)">
  <b style="color:var(--ice)">核心循环</b><br>
  · 每天用行动消耗 ⚡体力，晚上睡觉恢复并进入下一天<br>
  · 每晚消耗 1 食物 + 1 燃料，缺了会掉健康心情<br>
  · 第 30 天「大寒潮」降临，迎来结局<br><br>
  <b style="color:var(--ice)">怎么变强</b><br>
  · 打工赚钱：工地/超市/药店/加油站/集市<br>
  · 郊区跑步：体力上限 +2/次（上限 200）<br>
  · 五维属性：体能/智力/手艺/魅力/生存，做什么涨什么<br>
  · 花钱加固避难所、囤货、买装备<br><br>
  <b style="color:var(--ice)">小贴士</b><br>
  · 存款低于 ¥50 可去集市救济站领救济<br>
  · 📱 终端里有黑市、空投补给、天气预报<br>
  · 废墟能暴富，但小心异兽<br>
  · 每 10 天要交避难所维护费<br>
  · 死后进入下一世，用本源点买天赋，越轮回越强
  </div>
  <button class="btn" style="margin-top:10px" onclick="closeModal()">关闭</button>`);
}
function toggleSound(){G.set.sound=!G.set.sound;save();viewTitle();if(G.set.sound)sfx.click()}

/* ============================================================
   启动
   ============================================================ */
if(G.screen==='game'&&G.day>=1&&G.hp>0){viewTitle()}
else if(G.screen==='dead'){viewTitle()}
else{viewTitle()}
</script>
</body>
</html>
