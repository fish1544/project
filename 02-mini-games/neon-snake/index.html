<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>霓虹贪吃蛇 · NEON SNAKE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0e1a;
    --bg2: #0f1525;
    --grid: rgba(0, 255, 136, 0.04);
    --neon-green: #00ff88;
    --neon-pink: #ff4488;
    --neon-cyan: #00e5ff;
    --text: #e8f0ff;
    --text-dim: #6b7a99;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', 'Consolas', monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(0, 255, 136, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(255, 68, 136, 0.06) 0%, transparent 50%),
      var(--bg);
  }

  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 16px;
  }

  /* ===== 顶部状态栏 ===== */
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    width: 100%;
    max-width: 420px;
  }

  .hud-left, .hud-right {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .hud-right { text-align: right; }

  .hud-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .hud-value {
    font-size: 28px;
    font-weight: bold;
    line-height: 1;
  }

  #score {
    color: var(--neon-green);
    text-shadow: 0 0 12px rgba(0, 255, 136, 0.6);
  }

  #highScore {
    color: var(--neon-pink);
    text-shadow: 0 0 12px rgba(255, 68, 136, 0.5);
  }

  .game-title {
    font-size: 14px;
    letter-spacing: 6px;
    color: var(--neon-cyan);
    text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    text-transform: uppercase;
  }

  /* ===== 游戏画布 ===== */
  .canvas-container {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    box-shadow:
      0 0 40px rgba(0, 255, 136, 0.1),
      0 0 80px rgba(0, 229, 255, 0.05),
      inset 0 0 0 1px rgba(0, 255, 136, 0.15);
  }

  canvas {
    display: block;
    background: var(--bg2);
  }

  /* ===== 覆盖层面板 ===== */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: rgba(10, 14, 26, 0.92);
    backdrop-filter: blur(4px);
    z-index: 10;
    transition: opacity 0.3s ease;
  }

  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .overlay-title {
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .overlay-title.green {
    color: var(--neon-green);
    text-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
  }

  .overlay-title.pink {
    color: var(--neon-pink);
    text-shadow: 0 0 20px rgba(255, 68, 136, 0.6);
  }

  .overlay-sub {
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.8;
  }

  .final-score {
    font-size: 48px;
    font-weight: bold;
    color: var(--neon-green);
    text-shadow: 0 0 24px rgba(0, 255, 136, 0.7);
  }

  .final-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .btn {
    padding: 12px 36px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--neon-green);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(0, 255, 136, 0.7);
  }

  .btn:active {
    transform: translateY(0);
  }

  .controls-hint {
    display: flex;
    gap: 24px;
    font-size: 11px;
    color: var(--text-dim);
  }

  .controls-hint span {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    height: 24px;
    padding: 0 6px;
    border: 1px solid rgba(107, 122, 153, 0.4);
    border-radius: 4px;
    font-size: 11px;
    color: var(--text);
  }

  /* ===== 移动端方向键 ===== */
  .touch-pad {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 8px;
    margin-top: 4px;
  }

  .touch-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 255, 136, 0.08);
    border: 1px solid rgba(0, 255, 136, 0.2);
    border-radius: 8px;
    color: var(--neon-green);
    font-size: 20px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .touch-btn:active {
    background: rgba(0, 255, 136, 0.2);
  }

  .touch-up { grid-column: 2; grid-row: 1; }
  .touch-left { grid-column: 1; grid-row: 2; }
  .touch-down { grid-column: 2; grid-row: 2; }
  .touch-right { grid-column: 3; grid-row: 2; }

  @media (hover: none) and (pointer: coarse) {
    .touch-pad { display: grid; }
    .controls-hint { display: none; }
  }
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="hud">
    <div class="hud-left">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="score">0</div>
    </div>
    <div class="game-title">Neon Snake</div>
    <div class="hud-right">
      <div class="hud-label">Best</div>
      <div class="hud-value" id="highScore">0</div>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas"></canvas>

    <!-- 开始面板 -->
    <div class="overlay" id="startOverlay">
      <div class="overlay-title green">NEON SNAKE</div>
      <div class="overlay-sub">
        方向键 / WASD 控制移动<br>
        空格键暂停 · 吃掉发光能量体成长
      </div>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>

    <!-- 暂停面板 -->
    <div class="overlay hidden" id="pauseOverlay">
      <div class="overlay-title" style="color: var(--neon-cyan); text-shadow: 0 0 20px rgba(0,229,255,0.6);">PAUSED</div>
      <div class="overlay-sub">按空格键或点击按钮继续</div>
      <button class="btn" id="resumeBtn">继续</button>
    </div>

    <!-- 结束面板 -->
    <div class="overlay hidden" id="gameOverOverlay">
      <div class="overlay-title pink">GAME OVER</div>
      <div>
        <div class="final-label" style="text-align:center; margin-bottom:4px;">最终得分</div>
        <div class="final-score" id="finalScore">0</div>
      </div>
      <button class="btn" id="restartBtn">再来一局</button>
    </div>
  </div>

  <div class="controls-hint">
    <span><span class="key">↑↓←→</span> / <span class="key">WASD</span> 移动</span>
    <span><span class="key">Space</span> 暂停</span>
  </div>

  <div class="touch-pad">
    <div class="touch-btn touch-up" data-dir="up">▲</div>
    <div class="touch-btn touch-left" data-dir="left">◀</div>
    <div class="touch-btn touch-down" data-dir="down">▼</div>
    <div class="touch-btn touch-right" data-dir="right">▶</div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ===== 常量 =====
  const GRID_SIZE = 20;          // 网格数
  const BASE_INTERVAL = 150;      // 初始移动间隔 ms
  const MIN_INTERVAL = 60;        // 最快间隔
  const SPEED_STEP = 2;          // 每吃一个加速 ms

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // 高分屏适配
  const dpr = window.devicePixelRatio || 1;
  const CELL = 20;               // 每格 CSS 像素
  const BOARD_PX = GRID_SIZE * CELL;

  canvas.width = BOARD_PX * dpr;
  canvas.height = BOARD_PX * dpr;
  canvas.style.width = BOARD_PX + 'px';
  canvas.style.height = BOARD_PX + 'px';
  ctx.scale(dpr, dpr);

  // ===== 游戏状态 =====
  let snake = [];
  let direction = { x: 1, y: 0 };
  let nextDirection = { x: 1, y: 0 };
  let food = { x: 10, y: 10 };
  let score = 0;
  let highScore = 0;
  let gameRunning = false;
  let gamePaused = false;
  let lastMoveTime = 0;
  let moveInterval = BASE_INTERVAL;
  let particles = [];
  let foodPulse = 0;
  let animFrameId = null;

  // 读取最高分
  try {
    highScore = parseInt(localStorage.getItem('neonSnakeHighScore') || '0', 10);
  } catch (e) {
    highScore = 0;
  }
  document.getElementById('highScore').textContent = highScore;

  // ===== DOM 引用 =====
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const startOverlay = document.getElementById('startOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const finalScoreEl = document.getElementById('finalScore');

  // ===== 初始化 =====
  function resetGame() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    moveInterval = BASE_INTERVAL;
    particles = [];
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    let valid = false;
    while (!valid) {
      food.x = Math.floor(Math.random() * GRID_SIZE);
      food.y = Math.floor(Math.random() * GRID_SIZE);
      valid = !snake.some(s => s.x === food.x && s.y === food.y);
    }
  }

  // ===== 粒子效果 =====
  function spawnParticles(x, y, color) {
    const cx = (x + 0.5) * CELL;
    const cy = (y + 0.5) * CELL;
    for (let i = 0; i < 12; i++) {
      const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.5;
      const speed = 1 + Math.random() * 2;
      particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color: color
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.95;
      p.vy *= 0.95;
      p.life -= dt * 0.003;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ===== 游戏主循环 =====
  function gameLoop(timestamp) {
    if (!gameRunning) return;
    animFrameId = requestAnimationFrame(gameLoop);

    if (!gamePaused) {
      const dt = timestamp - lastMoveTime;
      foodPulse += dt * 0.005;

      if (dt >= moveInterval) {
        lastMoveTime = timestamp;
        updateSnake();
      }

      updateParticles(dt);
    }

    draw();
  }

  function updateSnake() {
    direction = { ...nextDirection };
    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    // 撞墙检测
    if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
      gameOver();
      return;
    }

    // 撞自身检测
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    // 吃食物
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      spawnParticles(food.x, food.y, '#ff4488');
      moveInterval = Math.max(MIN_INTERVAL, moveInterval - SPEED_STEP);
      placeFood();
    } else {
      snake.pop();
    }
  }

  // ===== 绘制 =====
  function draw() {
    // 清空
    ctx.fillStyle = '#0f1525';
    ctx.fillRect(0, 0, BOARD_PX, BOARD_PX);

    // 网格线
    ctx.strokeStyle = 'rgba(0, 255, 136, 0.04)';
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID_SIZE; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, BOARD_PX);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(BOARD_PX, i * CELL);
      ctx.stroke();
    }

    // 食物（脉冲发光）
    const pulse = Math.sin(foodPulse) * 0.3 + 0.7;
    const fx = (food.x + 0.5) * CELL;
    const fy = (food.y + 0.5) * CELL;
    const foodRadius = CELL * 0.35 * pulse;

    ctx.save();
    ctx.shadowColor = '#ff4488';
    ctx.shadowBlur = 15 * pulse;
    ctx.fillStyle = '#ff4488';
    ctx.beginPath();
    ctx.arc(fx, fy, foodRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 蛇身
    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const sx = seg.x * CELL;
      const sy = seg.y * CELL;
      const isHead = i === 0;
      const alpha = isHead ? 1 : Math.max(0.3, 1 - i * 0.03);

      ctx.save();
      ctx.shadowColor = '#00ff88';
      ctx.shadowBlur = isHead ? 18 : 8;
      ctx.fillStyle = isHead
        ? '#00ff88'
        : `rgba(0, ${255 - Math.min(100, i * 4)}, 136, ${alpha})`;

      const pad = isHead ? 1 : 2;
      roundRect(sx + pad, sy + pad, CELL - pad * 2, CELL - pad * 2, isHead ? 5 : 3);
      ctx.fill();
      ctx.restore();

      // 蛇头眼睛
      if (isHead) {
        ctx.fillStyle = '#0a0e1a';
        const eyeSize = 2.5;
        let ex1, ey1, ex2, ey2;
        const cx = sx + CELL / 2;
        const cy = sy + CELL / 2;

        if (direction.x === 1) {
          ex1 = cx + 3; ey1 = cy - 3;
          ex2 = cx + 3; ey2 = cy + 3;
        } else if (direction.x === -1) {
          ex1 = cx - 3; ey1 = cy - 3;
          ex2 = cx - 3; ey2 = cy + 3;
        } else if (direction.y === -1) {
          ex1 = cx - 3; ey1 = cy - 3;
          ex2 = cx + 3; ey2 = cy - 3;
        } else {
          ex1 = cx - 3; ey1 = cy + 3;
          ex2 = cx + 3; ey2 = cy + 3;
        }

        ctx.beginPath();
        ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 粒子
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // ===== 游戏控制 =====
  function startGame() {
    resetGame();
    gameRunning = true;
    gamePaused = false;
    startOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    lastMoveTime = performance.now();
    animFrameId = requestAnimationFrame(gameLoop);
  }

  function pauseGame() {
    if (!gameRunning || gamePaused) return;
    gamePaused = true;
    pauseOverlay.classList.remove('hidden');
  }

  function resumeGame() {
    if (!gameRunning || !gamePaused) return;
    gamePaused = false;
    pauseOverlay.classList.add('hidden');
    lastMoveTime = performance.now();
  }

  function togglePause() {
    if (!gameRunning) return;
    if (gamePaused) resumeGame();
    else pauseGame();
  }

  function gameOver() {
    gameRunning = false;
    cancelAnimationFrame(animFrameId);

    // 更新最高分
    if (score > highScore) {
      highScore = score;
      highScoreEl.textContent = highScore;
      try {
        localStorage.setItem('neonSnakeHighScore', String(highScore));
      } catch (e) {}
    }

    finalScoreEl.textContent = score;
    gameOverOverlay.classList.remove('hidden');
  }

  // ===== 输入 =====
  function setDirection(dir) {
    const dirs = {
      up:    { x: 0, y: -1 },
      down:  { x: 0, y: 1 },
      left:  { x: -1, y: 0 },
      right: { x: 1, y: 0 }
    };
    const d = dirs[dir];
    if (!d) return;

    // 禁止反向
    if (d.x === -direction.x && d.y === -direction.y) return;
    nextDirection = d;
  }

  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp':
      case 'w': case 'W':
        e.preventDefault();
        setDirection('up');
        break;
      case 'ArrowDown':
      case 's': case 'S':
        e.preventDefault();
        setDirection('down');
        break;
      case 'ArrowLeft':
      case 'a': case 'A':
        e.preventDefault();
        setDirection('left');
        break;
      case 'ArrowRight':
      case 'd': case 'D':
        e.preventDefault();
        setDirection('right');
        break;
      case ' ':
        e.preventDefault();
        togglePause();
        break;
    }
  });

  // 触摸滑动
  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? 'right' : 'left');
    } else {
      setDirection(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  // 虚拟方向键
  document.querySelectorAll('.touch-btn').forEach(btn => {
    const dir = btn.dataset.dir;
    const handler = (e) => {
      e.preventDefault();
      setDirection(dir);
    };
    btn.addEventListener('touchstart', handler, { passive: false });
    btn.addEventListener('mousedown', handler);
  });

  // 按钮
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
  document.getElementById('resumeBtn').addEventListener('click', resumeGame);

  // 切后台自动暂停
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pauseGame();
  });

  // 初始绘制
  resetGame();
  draw();
})();
</script>

</body>
</html>
