<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>合成防线 · Merge Defense（合成 + 防守 玩法验证 Demo）</title>
<style>
  :root {
    --bg: #0a0e13;
    --panel: rgba(255, 255, 255, .045);
    --panel-strong: rgba(255, 255, 255, .08);
    --line: rgba(255, 255, 255, .10);
    --text: #e8edf4;
    --muted: #9aa6b5;
    --amber: #e2a745;
    --teal: #4cb6c4;
    --orange: #e0703f;
    --steel: #8b93a7;
    --danger: #e04b2f;
    --ok: #7ec08a;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(900px 500px at 20% -10%, rgba(226, 167, 69, .10), transparent 60%),
      radial-gradient(700px 400px at 90% 0%, rgba(76, 182, 196, .08), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .app { max-width: 1080px; margin: 0 auto; padding: 14px 16px 28px; }

  /* ---------- HUD ---------- */
  .hud {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 14px; backdrop-filter: blur(6px);
  }
  .stat-block { display: flex; flex-direction: column; gap: 1px; min-width: 64px; }
  .stat-block .k { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .stat-block .v {
    font-size: 17px; font-weight: 650; font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  .v.gold { color: var(--amber); }
  .v.timer { color: var(--text); }
  .v.timer.warn { color: var(--danger); }
  .hearts { display: flex; gap: 2px; align-items: center; height: 18px; }
  .hearts .seg { width: 6px; height: 12px; border-radius: 2px; background: #e4634a; box-shadow: 0 0 6px rgba(228, 99, 74, .35); }
  .hearts .seg.off { background: rgba(255, 255, 255, .14); box-shadow: none; }
  .phase-badge {
    font-size: 11px; padding: 3px 9px; border-radius: 999px; letter-spacing: .1em;
    border: 1px solid var(--line); color: var(--muted);
  }
  .phase-badge.prep { color: var(--teal); border-color: rgba(76, 182, 196, .45); background: rgba(76, 182, 196, .08); }
  .phase-badge.combat { color: #f08a5d; border-color: rgba(224, 112, 63, .45); background: rgba(224, 112, 63, .10); }
  .spacer { flex: 1 1 auto; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; color: var(--text); background: var(--panel-strong); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 12px; cursor: pointer; transition: .16s ease;
  }
  button:hover:not(:disabled) { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .22); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .38; cursor: not-allowed; }
  button.primary { background: rgba(226, 167, 69, .18); border-color: rgba(226, 167, 69, .55); color: #ffd79a; }
  button.primary:hover:not(:disabled) { background: rgba(226, 167, 69, .28); }
  button.kbd::after { content: attr(data-kbd); font-size: 10px; color: var(--muted); margin-left: 6px; }

  /* ---------- 预告 ---------- */
  .preview {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    margin-top: 10px; padding: 9px 14px; border-radius: 12px;
    background: rgba(255, 255, 255, .03); border: 1px dashed rgba(255, 255, 255, .12);
    font-size: 12.5px; color: var(--muted);
  }
  .preview b { color: var(--text); font-weight: 600; }
  .pip { display: inline-flex; align-items: center; gap: 5px; margin-right: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 3px; display: inline-block; }
  .hint { color: var(--amber); }

  /* ---------- 战场 ---------- */
  .stage { margin-top: 12px; position: relative; }
  canvas {
    display: block; width: 100%; aspect-ratio: 1000 / 520;
    border-radius: var(--radius); border: 1px solid var(--line);
    background: #0c1219; touch-action: none; cursor: default;
  }
  canvas.dragging { cursor: grabbing; }

  /* ---------- 商店 ---------- */
  .shop {
    margin-top: 12px; display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap;
  }
  .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; flex: 1 1 560px; }
  .card {
    display: grid; grid-template-areas: "glyph name" "glyph meta"; align-items: center;
    gap: 0 8px; text-align: left; padding: 8px 10px; border-radius: 12px;
    background: rgba(255, 255, 255, .05); border: 1px solid var(--line); position: relative;
  }
  .card:hover:not(:disabled) { background: rgba(255, 255, 255, .1); }
  .card .glyph {
    grid-area: glyph; width: 34px; height: 34px; border-radius: 9px;
    display: grid; place-items: center; font-weight: 700; font-size: 15px;
    background: rgba(255, 255, 255, .07); border: 1px solid var(--line);
  }
  .card .name { grid-area: name; font-size: 13px; font-weight: 650; }
  .card .meta { grid-area: meta; font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; }
  .card .cost {
    position: absolute; right: 8px; top: 6px; font-size: 12px; color: var(--amber);
    font-family: ui-monospace, monospace;
  }
  .card.poor { opacity: .55; }
  .shop-side { display: flex; flex-direction: column; gap: 6px; min-width: 118px; }
  .shop-side button { width: 100%; }
  .tip { font-size: 11px; color: var(--muted); line-height: 1.35; }

  /* ---------- 调试 ---------- */
  details.debug {
    margin-top: 14px; border: 1px solid var(--line); border-radius: 12px;
    background: rgba(255, 255, 255, .02); padding: 0 12px;
  }
  details.debug summary {
    cursor: pointer; padding: 9px 0; font-size: 12.5px; color: var(--muted); list-style: none;
  }
  details.debug summary::before { content: "▸ "; }
  details.debug[open] summary::before { content: "▾ "; }
  .dbg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; padding: 4px 0 14px; }
  .dbg-cell { background: rgba(255, 255, 255, .04); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
  .dbg-cell .k { font-size: 10.5px; color: var(--muted); letter-spacing: .03em; }
  .dbg-cell .v { font-family: ui-monospace, monospace; font-size: 13px; font-variant-numeric: tabular-nums; }
  .dbg-row { display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 12px; }
  .dbg-row label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }

  /* ---------- 浮层 ---------- */
  .overlay {
    position: fixed; inset: 0; display: none; place-items: center; padding: 20px;
    background: rgba(5, 8, 12, .78); backdrop-filter: blur(7px); z-index: 30;
  }
  .overlay.show { display: grid; }
  .sheet {
    width: min(680px, 100%); max-height: 88vh; overflow: auto;
    background: linear-gradient(180deg, rgba(22, 28, 36, .96), rgba(14, 19, 25, .96));
    border: 1px solid rgba(255, 255, 255, .12); border-radius: 18px; padding: 22px 24px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
  }
  .sheet h2 { font-size: 21px; letter-spacing: .01em; }
  .sheet .sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .sheet .body { margin-top: 14px; font-size: 13px; color: #cdd6e1; }
  .sheet .body h3 { font-size: 13.5px; margin: 14px 0 6px; color: var(--amber); font-weight: 650; }
  .sheet .body p, .sheet .body li { margin: 4px 0; }
  .sheet .body ul { padding-left: 18px; }
  .sheet table { width: 100%; border-collapse: collapse; margin: 8px 0 4px; font-size: 12px; }
  .sheet th, .sheet td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
  .sheet th { color: var(--muted); font-weight: 500; }
  .sheet td.num { font-family: ui-monospace, monospace; color: var(--amber); }
  .sheet .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-top: 12px; }
  .result-grid div { background: rgba(255, 255, 255, .045); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .result-grid .k { font-size: 10.5px; color: var(--muted); }
  .result-grid .v { font-family: ui-monospace, monospace; font-size: 15px; }
  .result-grid .v.bad { color: var(--danger); }
  .result-grid .v.good { color: var(--ok); }

  /* ---------- toast ---------- */
  .toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: 26px; display: flex; flex-direction: column; gap: 6px; z-index: 40; pointer-events: none; }
  .toast {
    font-size: 12.5px; padding: 7px 14px; border-radius: 999px;
    background: rgba(18, 24, 32, .92); border: 1px solid var(--line); color: var(--text);
    animation: toastIn .18s ease both;
  }
  .toast.warn { border-color: rgba(224, 75, 47, .5); color: #ffb3a1; }
  .toast.gold { border-color: rgba(226, 167, 69, .5); color: #ffd79a; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (max-width: 720px) {
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat-block .v { font-size: 15px; }
    .app { padding: 10px 10px 22px; }
    .sheet { padding: 18px 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- HUD -->
  <div class="hud">
    <div class="stat-block">
      <span class="k">波次</span>
      <span class="v" id="hudRound">1 / 10</span>
    </div>
    <span class="phase-badge prep" id="hudPhase">准备</span>
    <div class="stat-block">
      <span class="k">倒计时</span>
      <span class="v timer" id="hudTimer">30.0s</span>
    </div>
    <div class="stat-block">
      <span class="k">金币</span>
      <span class="v gold" id="hudGold">10</span>
    </div>
    <div class="stat-block">
      <span class="k">基地</span>
      <span class="hearts" id="hudBase">❤❤❤</span>
    </div>
    <span class="spacer"></span>
    <div class="btns">
      <button class="primary kbd" id="btnFight" data-kbd="F">立即开战</button>
      <button class="kbd" id="btnPause" data-kbd="P">暂停</button>
      <button class="kbd" id="btnSpeed" data-kbd="S">×1</button>
      <button class="kbd" id="btnRules" data-kbd="?">规则</button>
    </div>
  </div>

  <!-- 下一波预告 -->
  <div class="preview" id="preview"></div>

  <!-- 战场 -->
  <div class="stage">
    <canvas id="cv" width="1000" height="520"></canvas>
  </div>

  <!-- 商店 -->
  <div class="shop">
    <div class="cards" id="shop"></div>
    <div class="shop-side">
      <button id="btnReroll">刷新商店 −1</button>
      <div class="tip" id="slotTip">槽位 0 / 10</div>
      <div class="tip">拖动单位到同型同级单位上即可合成</div>
    </div>
  </div>

  <!-- 调试与参数 -->
  <details class="debug" id="debug">
    <summary>数值 / 调试面板（同一份 ruleset 配置）</summary>
    <div class="dbg-grid" id="dbgGrid"></div>
    <div class="dbg-row">
      <label><input type="checkbox" id="chkMergeCombat" checked /> 战斗中允许合成/移动</label>
      <label><button id="btnResetSeed">换种子重开</button></label>
    </div>
  </details>
</div>

<div class="overlay" id="overlay"></div>
<div class="toasts" id="toasts"></div>

<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
